function animaisSelecionadosEvento(){
  if(!marcado("e-vincular"))return [];
  return [...document.querySelectorAll('input[name=ev-animal]:checked')].map(x=>x.value);
}
function equipeSelecionada(){return [...document.querySelectorAll('input[name=eq-func]:checked')].map(x=>x.value)}
function conflitosEscala(data,equipe,ignorarId){
  const out=[];
  equipe.forEach(fid=>{
    const ev=E.find(x=>x.id!==ignorarId&&x.data===data&&!x.feito&&(x.equipe||[]).includes(fid));
    if(ev)out.push(`${nomeFunc(fid)} já está escalado em “${ev.titulo}” (${ev.cc||"Geral"}) em ${dBR(data)}`);
  });
  return out;
}
function salvarEvento(id){
  if(!val("e-data")){toast("Preencha a data.");return}
  const equipe=equipeSelecionada();
  const conf=conflitosEscala(val("e-data"),equipe,id||null);
  if(conf.length){alert("Conflito de escala:\n\n• "+conf.join("\n• ")+"\n\nRetire o funcionário da outra atividade (ou desta) antes de salvar.");return}
  const cc=val("e-cc");
  let rotulo=val("e-tipo");
  const tipo=baseDeLabel(cc,rotulo);
  const animais=animaisSelecionadosEvento();
  const d={data:val("e-data"),tipo:rotulo,base:tipo,cc,cat:val("e-cat"),obs:val("e-obs"),equipe,animais,titulo:rotulo};
  if(ehManejoLivre(tipo)){
    const livre=val("e-outro");
    if(!livre){toast("Descreva qual é o manejo.");return}
    d.tituloLivre=livre; d.titulo=livre;
    if(marcado("e-outro-salvar")){
      const c=cfgManejos(cc);
      if(!manejosCC(cc).some(m=>m.label.toLowerCase()===livre.toLowerCase())){c.extras.push(livre);salvarCFG()}
      d.tipo=livre; rotulo=livre;
    }
  }
  if(["Vacinação","Vermifugação","Medicação"].includes(tipo)){
    d.produto=val("e-produto"); d.dose=val("e-dose");
    if(d.produto)d.titulo=d.produto;
  }
  if(tipo==="Pesagem"){
    const peso=val("e-peso");
    d.leituras=animais.map(aid=>({animalId:aid,valor:peso}));
  }
  let subtipo="",resultado="",agendarDG=false;
  if(tipo==="Reprodução"){
    subtipo=val("e-subtipo"); d.subtipoRepro=subtipo;
    if(subtipo==="Diagnóstico de gestação (DG)"){
      d.subtipoRepro="DG"; resultado=val("e-resultado"); d.resultado=resultado; d.titulo="Diagnóstico de gestação (DG)";
      d.leituras=animais.map(aid=>({animalId:aid,valor:resultado}));
    }else{
      const touroSel=val("e-touro-sel");
      d.protocolo=val("e-protocolo");
      if(touroSel&&touroSel!=="_outro"){d.touroId=touroSel;d.touroTxt=""}
      else{d.touroId="";d.touroTxt=val("e-touro-txt")}
      d.titulo=subtipo;
      agendarDG=!id&&document.getElementById("e-agendardg")&&marcado("e-agendardg");
    }
  }
  if(id)Object.assign(E.find(x=>x.id===id),d);
  else E.push({id:uid(),feito:false,...d});
  if(tipo==="Pesagem"&&animais.length){
    animais.forEach(aid=>atualizarPesoAnimal(aid));
    salvarA();
  }
  if(d.subtipoRepro==="DG"&&animais.length){
    animais.forEach(aid=>{
      const an=A.find(x=>x.id===aid); if(!an)return;
      if(resultado==="Prenhe"){an.reproStatus="Prenhe";an.prevParto=addDias(d.data,283)}
      else{an.reproStatus="Vazia";an.prevParto=""}
    });
    salvarA();
  }
  if(agendarDG&&animais.length){
    E.push({id:uid(),data:addDias(d.data,30),tipo:rotuloManejo(d.cc,"Reprodução"),base:"Reprodução",subtipoRepro:"DG",cc:d.cc,titulo:"Diagnóstico de gestação (DG)",cat:d.cat,obs:`Referente ao ${subtipo==="IATF"?"IATF":"repasse"} de ${dBR(d.data)}`,equipe:[],animais,feito:false});
  }
  salvarE(); fecharModal(); render();
  toast(d.subtipoRepro==="DG"&&animais.length?`Atividade salva e status reprodutivo atualizado (${animais.length} animal(is)).`:agendarDG?"Atividade salva e DG agendado para 30 dias.":"Atividade salva no calendário.");
}
function toggleEvento(id){const e=E.find(x=>x.id===id);e.feito=!e.feito;salvarE();render()}
function excluirEvento(id){E=E.filter(x=>x.id!==id);salvarE();render()}

/* =============== MANEJOS CONFIGURÁVEIS POR CENTRO DE CUSTO =============== */
let MJ_CC="Pecuária";
function usoManejo(cc,label){return E.filter(e=>(e.cc||"")===cc&&e.tipo===label).length}
function formManejosCultura(cid){const c=CFG.culturas.find(x=>x.id===cid);if(c)formManejos(c.nome)}
function formManejos(cc){
  MJ_CC=cc||MJ_CC;
  const lista=manejosCC(MJ_CC);
  const c=(CFG.manejos||{})[MJ_CC]||{};
  const ocultos=(c.ocultos||[]).filter(b=>tiposBaseCC(MJ_CC).includes(b));
  abrirModal(`${cab("Manejos e atividades")}
  <div class="field"><label>Centro de custo</label><select id="mj-cc" onchange="formManejos(this.value)">${opt(ccList(),MJ_CC)}</select></div>
  <div class="criterio">Renomeie, remova da lista ou acrescente manejos. Ao renomear, as atividades já lançadas neste centro de custo passam a exibir o novo nome e o comportamento do sistema (campos de produto, peso, DG, atualização do rebanho) continua o mesmo.</div>
  <h3 style="margin-top:12px">Manejos disponíveis em ${esc(MJ_CC)}</h3>
  ${lista.map((x,i)=>{
    const n=usoManejo(MJ_CC,x.label);
    const fixo=ehManejoLivre(x.base)&&!x.custom;
    return `<div class="ev">
      <div style="flex:1">
        <div class="t">${esc(x.label)}</div>
        <div class="d">${x.custom?"criado pelo gestor":x.label!==x.base?`padrão do sistema · originalmente “${esc(x.base)}”`:"padrão do sistema"}${n?` · ${n} atividade(s) lançada(s)`:""}</div>
      </div>
      <button class="btn ghost az" onclick="renomearManejo(${i})" aria-label="Renomear">✎</button>
      ${fixo?"":`<button class="btn ghost" onclick="removerManejo(${i})" aria-label="Remover da lista">✕</button>`}
    </div>`}).join("")}
  <div class="row2" style="margin-top:11px;align-items:end">
    <div class="field" style="margin-bottom:0"><label>Acrescentar manejo</label><input id="mj-novo" placeholder="Ex.: Casqueamento, Roçagem, Análise de solo"></div>
    <div class="field" style="margin-bottom:0"><button class="btn" style="width:100%" onclick="addManejo()">Adicionar</button></div>
  </div>
  ${ocultos.length?`<h3>Fora da lista</h3>
    ${ocultos.map(b=>`<div class="ev"><div style="flex:1"><div class="t" style="color:var(--muted)">${esc(b)}</div><div class="d">removido da lista deste centro de custo</div></div>
      <button class="btn sm sec" onclick="restaurarManejo('${esc(b).replace(/'/g,"&#39;")}')">Restaurar</button></div>`).join("")}`:""}
  <div class="m-actions"><button class="btn sec" onclick="fecharModal()">Fechar</button></div>`);
}
function renomearManejo(i){
  const cc=MJ_CC, x=manejosCC(cc)[i]; if(!x)return;
  const novo=(prompt(`Nome da atividade em ${cc}:`,x.label)||"").trim();
  if(!novo||novo===x.label)return;
  if(manejosCC(cc).some((y,j)=>j!==i&&y.label.toLowerCase()===novo.toLowerCase())){toast("Já existe um manejo com esse nome neste centro de custo.");return}
  const c=cfgManejos(cc);
  if(x.custom)c.extras=c.extras.map(e=>e===x.label?novo:e);
  else c.renom[x.base]=novo;
  let n=0;
  E.forEach(e=>{if((e.cc||"")===cc&&e.tipo===x.label){e.base=e.base||x.base;e.tipo=novo;if(e.titulo===x.label)e.titulo=novo;n++}});
  salvarCFG(); if(n)salvarE();
  formManejos(cc); render();
  toast(`Manejo renomeado para “${novo}”${n?` — ${n} atividade(s) atualizada(s)`:""}.`);
}
function removerManejo(i){
  const cc=MJ_CC, x=manejosCC(cc)[i]; if(!x)return;
  const n=usoManejo(cc,x.label);
  if(!confirm(`Tirar “${x.label}” da lista de manejos de ${cc}?`+(n?`\n\nAs ${n} atividade(s) já lançada(s) continuam no calendário.`:"")))return;
  const c=cfgManejos(cc);
  if(x.custom)c.extras=c.extras.filter(e=>e!==x.label);
  else if(!c.ocultos.includes(x.base))c.ocultos.push(x.base);
  salvarCFG(); formManejos(cc); render(); toast("Manejo retirado da lista.");
}
function restaurarManejo(base){
  const c=cfgManejos(MJ_CC);
  c.ocultos=c.ocultos.filter(b=>b!==base);
  salvarCFG(); formManejos(MJ_CC); render(); toast(`“${base}” de volta à lista.`);
}
function addManejo(){
  const cc=MJ_CC, novo=val("mj-novo");
  if(!novo){toast("Dê um nome ao manejo.");return}
  if(manejosCC(cc).some(y=>y.label.toLowerCase()===novo.toLowerCase())){toast("Esse manejo já está na lista.");return}
  cfgManejos(cc).extras.push(novo);
  salvarCFG(); formManejos(cc); render(); toast(`“${novo}” disponível em ${cc}.`);
}

/* =============== SESSÃO DE MANEJO (registro rápido em lote) =============== */
let SESSAO=null;
function tituloSessao(t){return {Pesagem:"Pesagem",Vacinação:"Vacinação",Vermifugação:"Vermifugação",IATF:"Inseminação (IATF)",DG:"Diagnóstico de gestação (DG)"}[t]||t}
const ICO_MANEJO={"Pesagem":"⚖","Vacinação":"💉","Vermifugação":"🧪","Medicação":"💊","Reprodução":"🐄","Manejo":"🪢","Outro":"➕","Outra":"➕"};
/* barra de sessões de manejo — o conteúdo vem da lista de manejos do centro de custo,
   que o gestor edita em ⚙ Manejos (acrescentando ou retirando o que quiser) */
function barraSessoes(cc){
  const ms=manejosCC(cc);
  const btns=[];
  ms.forEach((m,i)=>{
    if(m.base==="Reprodução"){
      btns.push(`<button class="btn sm sec" onclick="abrirSessao('IATF')">🐄 ${esc(m.label)} · IATF</button>`);
      btns.push(`<button class="btn sm sec" onclick="abrirSessao('DG')">🔎 DG</button>`);
    }else{
      btns.push(`<button class="btn sm sec" onclick="abrirSessaoPec(${i})">${ICO_MANEJO[m.base]||"•"} ${esc(m.label)}</button>`);
    }
  });
  return `<div class="toolbar">
    <span style="font-size:12.5px;color:var(--muted);align-self:center">Sessão de manejos:</span>
    ${btns.join("")}
    <button class="btn sm sec" onclick="formManejos('${cc}')">⚙ Personalizar</button>
  </div>`;
}
function abrirSessaoPec(i){
  const m=manejosCC("Pecuária")[i];
  if(m)abrirSessao(m.label);
}
function abrirSessao(chave){
  let base,label,subtipo="";
  if(chave==="IATF"||chave==="DG"){base="Reprodução";subtipo=chave;label=rotuloManejo("Pecuária","Reprodução")}
  else{label=chave;base=baseDeLabel("Pecuária",chave)}
  SESSAO={chave,label,base,subtipo,tipo:chave,produto:"",dose:"",protocolo:"",touroId:"",touroTxt:"",descricao:"",itens:[]};
  renderSessaoModal();
}
function tituloSessaoAtual(){
  if(SESSAO.subtipo==="IATF")return SESSAO.label+" — inseminação (IATF)";
  if(SESSAO.subtipo==="DG")return "Diagnóstico de gestação (DG)";
  return SESSAO.label;
}
function renderSessaoModal(){
  const b=SESSAO.base, sub=SESSAO.subtipo;
  const touros=bovinosMachosAtivos();
  let camposComuns="";
  if(b==="Vacinação"||b==="Vermifugação"||b==="Medicação"){
    const rot=b==="Vacinação"?"Vacina":b==="Vermifugação"?"Vermífugo":"Medicamento";
    camposComuns=`<div class="row2">
      <div class="field"><label>${rot}</label><input id="ss-produto" value="${esc(SESSAO.produto)}" oninput="SESSAO.produto=this.value" placeholder="Ex.: ${b==="Vacinação"?"Brucelose B19":b==="Vermifugação"?"Cydectin":"Oxitetraciclina"}"></div>
      <div class="field"><label>Dose (opcional)</label><input id="ss-dose" value="${esc(SESSAO.dose)}" oninput="SESSAO.dose=this.value" placeholder="Ex.: 5 ml SC"></div>
    </div>`;
  }else if(ehManejoLivre(b)){
    camposComuns=`<div class="field"><label>Qual manejo? (descreva)</label><input id="ss-desc" value="${esc(SESSAO.descricao)}" oninput="SESSAO.descricao=this.value" placeholder="Ex.: casqueamento, brincagem, apartação"></div>`;
  }else if(sub==="IATF"){
    camposComuns=`<div class="row2">
      <div class="field"><label>Protocolo</label><input id="ss-protocolo" value="${esc(SESSAO.protocolo)}" oninput="SESSAO.protocolo=this.value" placeholder="Ex.: Protocolo IATF padrão"></div>
      <div class="field"><label>Touro</label><select id="ss-touro" onchange="mudaTouroSessao()">
        <option value="">— selecione —</option>
        ${touros.map(x=>`<option value="${x.id}" ${SESSAO.touroId===x.id?"selected":""}>${esc(nomeAnimal(x))}${x.raca?" ("+esc(x.raca)+")":""}</option>`).join("")}
        <option value="_outro">Sêmen / outro (digitar)</option>
      </select></div>
    </div>
    <div class="field" id="ss-touro-txt-wrap" style="display:none"><input id="ss-touro-txt" value="${esc(SESSAO.touroTxt)}" oninput="SESSAO.touroTxt=this.value" placeholder="Nome/código do sêmen"></div>`;
  }
  abrirModal(`${cab("Sessão de manejo — "+tituloSessaoAtual())}
    ${camposComuns}
    <div class="field"><label>Buscar animal</label><input id="ss-busca" placeholder="Número, nome ou raça" oninput="buscarAnimalSessao()" autocomplete="off"></div>
    <div id="ss-resultados"></div>
    <h3>Registrados nesta sessão (<span id="ss-count">0</span>)</h3>
    <div id="ss-itens"><div class="criterio">Nenhum animal registrado ainda — busque acima.</div></div>
    <div class="row2" style="margin-top:14px">
      <div class="field"><label>Data da atividade</label><input id="ss-data" type="date" value="${hoje()}"></div>
      <div></div>
    </div>
    <div class="m-actions"><button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="concluirSessao()">Concluir sessão e salvar</button></div>`);
  document.getElementById("ss-busca").focus();
}
function mudaTouroSessao(){
  const v=val("ss-touro"); SESSAO.touroId=(v&&v!=="_outro")?v:"";
  document.getElementById("ss-touro-txt-wrap").style.display=v==="_outro"?"block":"none";
}
function buscarAnimalSessao(){
  const q=val("ss-busca").toLowerCase();
  const box=document.getElementById("ss-resultados");
  if(!q){box.innerHTML="";return}
  const usados=new Set(SESSAO.itens.map(i=>i.animalId));
  const res=animaisAtivosOrdenados().filter(a=>!usados.has(a.id)&&((a.numero||"")+" "+(a.nome||"")+" "+(a.raca||"")+" "+(a.especie||"")).toLowerCase().includes(q)).slice(0,8);
  const t=SESSAO.base==="Pesagem"?"Pesagem":SESSAO.subtipo==="DG"?"DG":"";
  if(!res.length){box.innerHTML=`<div class="criterio" style="padding:4px 2px">Nenhum animal encontrado.</div>`;return}
  box.innerHTML=`<div class="fgrid" style="grid-template-columns:1fr;max-height:180px">${res.map(a=>{
    const nome=esc((a.numero?a.numero+" ":"")+(a.nome||a.raca||a.especie));
    if(t==="Pesagem")return `<div class="ev" style="padding:7px 10px"><div style="flex:1"><b>${nome}</b></div>
      <input type="number" step="0.1" placeholder="kg" style="width:80px" id="ss-v-${a.id}" onkeydown="if(event.key==='Enter')adicionarItemSessao('${a.id}',this.value)">
      <button class="btn sm" onclick="adicionarItemSessao('${a.id}',document.getElementById('ss-v-${a.id}').value)">Adicionar</button></div>`;
    if(t==="DG")return `<div class="ev" style="padding:7px 10px"><div style="flex:1"><b>${nome}</b></div>
      <select id="ss-v-${a.id}" style="width:110px">${opt(["Prenhe","Vazia"],"Prenhe")}</select>
      <button class="btn sm" onclick="adicionarItemSessao('${a.id}',document.getElementById('ss-v-${a.id}').value)">Adicionar</button></div>`;
    return `<div class="ev" style="padding:7px 10px;cursor:pointer" onclick="adicionarItemSessao('${a.id}','')"><div style="flex:1"><b>${nome}</b></div><span class="btn sm sec">+ Adicionar</span></div>`;
  }).join("")}</div>`;
}
function adicionarItemSessao(animalId,valor){
  if(SESSAO.base==="Pesagem"&&!(+valor>0)){toast("Informe o peso.");return}
  SESSAO.itens.push({animalId,valor});
  document.getElementById("ss-busca").value="";
  document.getElementById("ss-resultados").innerHTML="";
  document.getElementById("ss-busca").focus();
  atualizarListaSessao();
}
function removerItemSessao(i){SESSAO.itens.splice(i,1);atualizarListaSessao()}
function atualizarListaSessao(){
  document.getElementById("ss-count").textContent=SESSAO.itens.length;
  document.getElementById("ss-itens").innerHTML=SESSAO.itens.length?SESSAO.itens.map((it,i)=>{
    const an=A.find(a=>a.id===it.animalId);
    return `<div class="ev" style="padding:8px 12px">
      <div style="flex:1"><b>${esc(an?(an.numero||nomeAnimal(an)):"?")}</b>${it.valor?` — ${esc(it.valor)}${SESSAO.base==="Pesagem"?" kg":""}`:""}</div>
      <button class="btn ghost" onclick="removerItemSessao(${i})" aria-label="Remover">✕</button>
    </div>`;
  }).join(""):'<div class="criterio">Nenhum animal registrado ainda — busque acima.</div>';
}
function concluirSessao(){
  if(!SESSAO.itens.length){toast("Registre ao menos um animal antes de concluir.");return}
  if(ehManejoLivre(SESSAO.base)&&!SESSAO.descricao){toast("Descreva qual é o manejo desta sessão.");return}
  const data=val("ss-data")||hoje();
  const b=SESSAO.base, sub=SESSAO.subtipo;
  const t=b==="Pesagem"?"Pesagem":sub==="DG"?"DG":"";
  const animais=SESSAO.itens.map(i=>i.animalId);
  const ev={id:uid(),data,cc:"Pecuária",equipe:[],animais,feito:true,sessao:true,base:b,tipo:SESSAO.label,titulo:SESSAO.label,
    leituras:SESSAO.itens.map(i=>({animalId:i.animalId,valor:i.valor}))};
  if(b==="Vacinação"||b==="Vermifugação"||b==="Medicação"){
    ev.produto=SESSAO.produto; ev.dose=SESSAO.dose; ev.titulo=SESSAO.produto||SESSAO.label;
  }else if(sub==="IATF"){
    ev.subtipoRepro="IATF"; ev.protocolo=SESSAO.protocolo; ev.touroId=SESSAO.touroId; ev.touroTxt=SESSAO.touroTxt; ev.titulo="IATF";
  }else if(sub==="DG"){
    ev.subtipoRepro="DG"; ev.titulo="Diagnóstico de gestação (DG)";
  }else if(ehManejoLivre(b)){
    ev.tituloLivre=SESSAO.descricao; ev.titulo=SESSAO.descricao;
  }
  E.push(ev);
  if(t==="Pesagem"){animais.forEach(aid=>atualizarPesoAnimal(aid));salvarA()}
  if(t==="DG"){
    SESSAO.itens.forEach(it=>{
      const an=A.find(a=>a.id===it.animalId); if(!an)return;
      if(it.valor==="Prenhe"){an.reproStatus="Prenhe";an.prevParto=addDias(data,283)}
      else{an.reproStatus="Vazia";an.prevParto=""}
    });
    salvarA();
  }
  salvarE(); render();
  abrirRelatorioSessao(ev);
}
function abrirRelatorioSessao(ev){
  const titSes=tituloSessao(baseEv(ev)==="Pesagem"?"Pesagem":baseEv(ev)==="Vacinação"?"Vacinação":baseEv(ev)==="Vermifugação"?"Vermifugação":ev.subtipoRepro==="IATF"?"IATF":"DG");
  const linhas=(ev.leituras||[]).map(it=>{
    const an=A.find(a=>a.id===it.animalId);
    let valorTxt="—";
    if(baseEv(ev)==="Pesagem")valorTxt=it.valor?`${it.valor} kg`:"—";
    else if(ev.subtipoRepro==="DG")valorTxt=it.valor||"—";
    return `<tr><td style="padding:5px;border-bottom:1px solid #eee">${esc(an?(an.numero||"—"):"—")}</td><td style="padding:5px;border-bottom:1px solid #eee">${esc(an?(an.nome||an.raca||an.especie):"Animal removido")}</td><td style="padding:5px;border-bottom:1px solid #eee;text-align:right">${esc(valorTxt)}</td></tr>`;
  }).join("");
  let extra="";
  if(baseEv(ev)==="Vacinação"||baseEv(ev)==="Vermifugação")extra=`<p><b>${baseEv(ev)==="Vacinação"?"Vacina":"Vermífugo"}:</b> ${esc(ev.produto||"—")}${ev.dose?` · Dose: ${esc(ev.dose)}`:""}</p>`;
  if(ev.subtipoRepro==="IATF"){
    const touro=ev.touroId?nomeAnimal(A.find(a=>a.id===ev.touroId)):ev.touroTxt;
    extra=`<p><b>Protocolo:</b> ${esc(ev.protocolo||"—")} &nbsp;·&nbsp; <b>Touro:</b> ${esc(touro||"—")}</p>`;
  }
  abrirModal(`${cab("Relatório — "+titSes)}
    <div class="relatorio-print">
      <h3 style="margin-top:0">${esc(titSes)} — Fazendas Reunidas</h3>
      <p><b>Data:</b> ${dBR(ev.data)} &nbsp;·&nbsp; <b>Animais atendidos:</b> ${(ev.leituras||[]).length}</p>
      ${extra}
      <table style="width:100%;border-collapse:collapse;margin-top:10px">
        <thead><tr><th style="text-align:left;border-bottom:2px solid #ccc;padding:5px">Nº</th><th style="text-align:left;border-bottom:2px solid #ccc;padding:5px">Animal</th><th style="text-align:right;border-bottom:2px solid #ccc;padding:5px">${baseEv(ev)==="Pesagem"?"Peso":ev.subtipoRepro==="DG"?"Resultado":""}</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
    <div class="m-actions"><button class="btn sec" onclick="fecharModal()">Fechar</button><button class="btn" onclick="window.print()">Imprimir relatório</button></div>`);
  toast(`Sessão concluída: ${(ev.leituras||[]).length} animal(is) registrados.`);
}

function lerArquivoImport(input){
  const f=input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=(ev)=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array",cellDates:true});
      if(!wb.SheetNames.length){toast("Não foram encontradas planilhas nesse arquivo.");return}
      IMPORT_PLAN.workbook=wb; IMPORT_PLAN.planilha=wb.SheetNames[0]; IMPORT_PLAN.arquivoNome=f.name;
      carregarPlanilhaSelecionada();

function autoDetectCol(headers,keywords){
  const h=headers.find(h=>keywords.some(k=>h.toLowerCase().includes(k)));
  return h||"";
}
function autoMapeamento(tipo,headers){
  headers=headers||[];
  if(!ehImportAnimal(tipo)){
    const m={colData:autoDetectCol(headers,KW_IMPORT.colData),dataUnica:hoje()};
    const cfg=IMPORT_AGRO[tipo]||{campos:[]};
    (cfg.campos||[]).forEach(([k])=>{m[k]=autoDetectCol(headers,KW_IMPORT[k]||[])});
    if(cfg.financeiro)m.lancarFin=true;
    if(cfg.manejo)m.manejo=rotuloManejo(IMPORT_PLAN.area,"Manejo");
    return m;
  }
  const m={colNum:autoDetectCol(headers,["número","numero","nº","n°","brinco","tag"]),
    colData:autoDetectCol(headers,["data"]),dataUnica:hoje()};
  if(tipo==="Pesagem")m.colValor=autoDetectCol(headers,["peso"]);
  if(tipo==="DG")m.colValor=autoDetectCol(headers,["resultado","diagnóstico","diagnostico","status","dg"]);
  if(tipo==="Vacinação"||tipo==="Vermifugação"){
    m.colProduto=autoDetectCol(headers,tipo==="Vacinação"?["vacina","produto"]:["vermífugo","vermifugo","produto"]);
    m.colDose=autoDetectCol(headers,["dose"]); m.produtoUnico="";
  }
  if(tipo==="IATF"){
    m.colTouro=autoDetectCol(headers,["touro","garanhão","garanhao","sêmen","semen"]);
    m.protocoloUnico=""; m.touroUnicoTxt="";
  }
  return m;
}
function parseDataPlanilha(v){
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400*1000));if(!isNaN(d))return d.toISOString().slice(0,10)}
  if(typeof v==="string"){
    const s=v.trim();
    let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  }
  return null;
}
function normalizarResultadoDG(v){
  const s=String(v||"").trim().toLowerCase();
  if(["prenhe","prenha","positivo","p","sim","gestante","pren"].includes(s))return "Prenhe";
  if(["vazia","negativo","n","não","nao","v","vaz"].includes(s))return "Vazia";
  return null;
}

/* ---- leitura das linhas dos modelos da agricultura ---- */
function numPlanilha(row,col){
  if(!col)return 0;
  const v=row[col];
  if(typeof v==="number")return v;
  let x=String(v||"").trim().replace(/R\$/gi,"").replace(/\s/g,"");
  if(!x)return 0;
  if(x.includes(",")&&x.includes("."))x=x.replace(/\./g,"").replace(",",".");
  else if(x.includes(","))x=x.replace(",",".");
  return +x||0;
}
function processarLinhasAgro(){
  const t=IMPORT_PLAN.tipo, m=IMPORT_PLAN.mapping, area=IMPORT_PLAN.area;
  const cult=CFG.culturas.find(c=>c.nome===area);
  const txt=(row,k)=>String((m[k]?row[m[k]]:"")||"").trim();
  const nm=(row,k)=>numPlanilha(row,m[k]);
  const regs=[],avisos=[]; let ignoradas=0;
  IMPORT_PLAN.rows.forEach(row=>{
    const data=m.colData?parseDataPlanilha(row[m.colData]):m.dataUnica;
    if(!data){ignoradas++;return}
    if(t==="Atividades / manejos"){
      regs.push({data,detalhe:txt(row,"colDetalhe"),obs:txt(row,"colObs")});
    }else if(t==="Colheitas / vendas"){
      const kg=nm(row,"colKg"),cx=nm(row,"colCaixas"),vkg=nm(row,"colVkg");
      let total=nm(row,"colValor");
      if(!total&&vkg&&kg)total=vkg*kg;
      if(!kg&&!cx&&!total){ignoradas++;return}
      regs.push({data,comprador:txt(row,"colComprador"),kg,caixas:cx,valorTotal:+total.toFixed(2),obs:txt(row,"colObs")});
    }else if(t==="Silos / ensilagem"){
      const nome=txt(row,"colNome");
      if(!nome){ignoradas++;return}
      regs.push({data,nome,forrageira:txt(row,"colForr"),qtd:nm(row,"colQtd"),obs:txt(row,"colObs")});
    }else if(t==="Saídas de silagem"){
      const nomeSilo=txt(row,"colSilo"), qtd=nm(row,"colQtd");
      const silo=AG.silos.find(x=>(!cult||x.culturaId===cult.id)&&String(x.nome||"").trim().toLowerCase()===nomeSilo.toLowerCase());
      if(!silo){if(nomeSilo&&!avisos.includes(nomeSilo))avisos.push(nomeSilo);ignoradas++;return}
      if(!(qtd>0)){ignoradas++;return}
      const tp=/venda|vendid/i.test(txt(row,"colTipoMov"))?"Venda":"Consumo interno";
      regs.push({data,siloId:silo.id,siloNome:silo.nome,tipo:tp,qtd,destino:txt(row,"colDest"),valor:nm(row,"colValor")});
    }else if(t==="Diárias de diaristas"){
      const nome=txt(row,"colNome"), v=nm(row,"colValor");
      if(!nome||!(v>0)){ignoradas++;return}
      regs.push({data,nome,atividade:txt(row,"colAtiv"),valor:v});
    }
  });
  return {regs,ignoradas,avisos};
}
function confirmarImportAgro(){
  const {regs,ignoradas,avisos}=processarLinhasAgro();

        F.push(l); mv.lancId=l.id; fin=true;
      }
      const si=AG.silos.find(x=>x.id===r.siloId); if(si&&si.status==="Fechado")si.status="Aberto";
      AG.movSilo.push(mv); ag=true;
    }else if(t==="Diárias de diaristas"){
      const d={id:uid(),culturaId:cult.id,data:r.data,nome:r.nome,atividade:r.atividade,valor:r.valor,status:"Pago",origem:"import"};
      if(lancar){
        const l={id:uid(),data:d.data,cc:cult.nome,categoria:"Mão de obra e encargos",tipo:"Saída",valor:d.valor,
          descricao:`Diarista ${d.nome}${d.atividade?" — "+d.atividade:""}`,status:"Pago",diariaId:d.id};
        F.push(l); d.lancId=l.id; fin=true;
      }
      AG.diaristas.push(d); ag=true;
    }
  });
  if(ag)salvarAG(); if(fin)salvarF(); if(ev)salvarE();
  render(); abrirRelatorioImportAgro(regs,ignoradas,avisos);
}

function processarLinhasImport(){
  const t=IMPORT_PLAN.tipo, m=IMPORT_PLAN.mapping;
  const grupos=new Map(); const naoReconhecidos=[]; let processadas=0;
  IMPORT_PLAN.rows.forEach(row=>{
    const numero=String((m.colNum?row[m.colNum]:"")||"").trim();
    if(!numero)return;
    const animal=A.find(a=>String(a.numero||"").trim().toLowerCase()===numero.toLowerCase());
    if(!animal){if(!naoReconhecidos.includes(numero))naoReconhecidos.push(numero);return}

    let valor="";
    if(t==="Pesagem"){const p=+row[m.colValor];if(!(p>0))return;valor=String(p)}
    else if(t==="DG"){const res=normalizarResultadoDG(row[m.colValor]);if(!res)return;valor=res}
    let produto="",dose="",protocolo="",touroTxt="";
    if(t==="Vacinação"||t==="Vermifugação"){
      produto=String((m.colProduto?row[m.colProduto]:m.produtoUnico)||"").trim();
      dose=String((m.colDose?row[m.colDose]:"")||"").trim();
      if(!produto)return;
    }
    if(t==="IATF"){
      protocolo=m.protocoloUnico||"";
      touroTxt=String((m.colTouro?row[m.colTouro]:m.touroUnicoTxt)||"").trim();
    }
    const chave=(t==="Pesagem"||t==="DG")?dataStr:(t==="IATF"?`${dataStr}|${touroTxt}`:`${dataStr}|${produto}|${dose}`);
    if(!grupos.has(chave))grupos.set(chave,{data:dataStr,produto,dose,protocolo,touroTxt,itens:[]});
    grupos.get(chave).itens.push({animalId:animal.id,valor});
    processadas++;
  });
  return {grupos:[...grupos.values()],processadas,naoReconhecidos};
}

function confirmarImportPlanilha(){
  if(!IMPORT_PLAN.rows.length){toast("Escolha o arquivo da planilha.");return}
  if(!ehImportAnimal()){confirmarImportAgro();return}
  if(!IMPORT_PLAN.mapping.colNum){toast("Selecione a coluna do número do animal.");return}
  const {grupos,processadas,naoReconhecidos}=processarLinhasImport();
  if(!processadas){toast("Nenhuma linha reconhecida para importar. Confira o mapeamento das colunas.");return}
  const t=IMPORT_PLAN.tipo;
  const eventosCriados=[];
  grupos.forEach(g=>{
    const animais=g.itens.map(i=>i.animalId);
    const ev={id:uid(),data:g.data,cc:"Pecuária",equipe:[],animais,feito:true,sessao:true,origem:"import",leituras:g.itens};
    const rot=b=>rotuloManejo("Pecuária",b);
    if(t==="Pesagem"){ev.base="Pesagem";ev.tipo=rot("Pesagem");ev.titulo=ev.tipo}
    else if(t==="Vacinação"||t==="Vermifugação"){ev.base=t;ev.tipo=rot(t);ev.produto=g.produto;ev.dose=g.dose;ev.titulo=g.produto||ev.tipo}
    else if(t==="IATF"){ev.base="Reprodução";ev.tipo=rot("Reprodução");ev.subtipoRepro="IATF";ev.protocolo=g.protocolo;ev.touroTxt=g.touroTxt;ev.titulo="IATF"}
    else if(t==="DG"){ev.base="Reprodução";ev.tipo=rot("Reprodução");ev.subtipoRepro="DG";ev.titulo="Diagnóstico de gestação (DG)"}
    E.push(ev); eventosCriados.push(ev);
    if(t==="Pesagem")animais.forEach(aid=>atualizarPesoAnimal(aid));
    if(t==="DG"){
      g.itens.forEach(it=>{
        const an=A.find(a=>a.id===it.animalId); if(!an)return;
        if(it.valor==="Prenhe"){an.reproStatus="Prenhe";an.prevParto=addDias(g.data,283)}
        else{an.reproStatus="Vazia";an.prevParto=""}
      });
    }
  });
  salvarE(); salvarA(); render();
  abrirRelatorioImportacao(eventosCriados,naoReconhecidos);
}
function abrirRelatorioImportacao(eventos,naoReconhecidos){
  if(!eventos.length)return;
  const totalAnimais=new Set(eventos.flatMap(e=>e.animais)).size;
  const t0=eventos[0];
  const chaveTipo=baseEv(t0)==="Pesagem"?"Pesagem":baseEv(t0)==="Vacinação"?"Vacinação":baseEv(t0)==="Vermifugação"?"Vermifugação":t0.subtipoRepro==="IATF"?"IATF":"DG";
  const linhas=eventos.flatMap(ev=>(ev.leituras||[]).map(it=>{
    const an=A.find(a=>a.id===it.animalId);
    let valorTxt="—";
    if(baseEv(ev)==="Pesagem")valorTxt=it.valor?`${it.valor} kg`:"—";
    else if(ev.subtipoRepro==="DG")valorTxt=it.valor||"—";
    let detalhe="";
    if(baseEv(ev)==="Vacinação"||baseEv(ev)==="Vermifugação")detalhe=esc(ev.produto||"—")+(ev.dose?` (${esc(ev.dose)})`:"");
    if(ev.subtipoRepro==="IATF")detalhe=`${esc(ev.protocolo||"—")}${ev.touroTxt?" · "+esc(ev.touroTxt):""}`;
    return `<tr><td style="padding:5px;border-bottom:1px solid #eee">${dBR(ev.data)}</td><td style="padding:5px;border-bottom:1px solid #eee">${esc(an?(an.numero||"—"):"—")}</td><td style="padding:5px;border-bottom:1px solid #eee">${esc(an?(an.nome||an.raca||an.especie):"—")}</td><td style="padding:5px;border-bottom:1px solid #eee;text-align:right">${esc(valorTxt)}</td><td style="padding:5px;border-bottom:1px solid #eee">${detalhe}</td></tr>`;
  })).join("");
  abrirModal(`${cab("Relatório de importação — "+tituloSessao(chaveTipo))}
    <div class="relatorio-print">
      <h3 style="margin-top:0">${esc(tituloSessao(chaveTipo))} — importado de planilha</h3>
      <p><b>Eventos criados:</b> ${eventos.length} &nbsp;·&nbsp; <b>Animais atendidos:</b> ${totalAnimais}</p>
      ${naoReconhecidos.length?`<p style="color:#A8402F"><b>Não encontrados no rebanho (${naoReconhecidos.length}):</b> ${naoReconhecidos.map(esc).join(", ")}</p>`:""}
      <table style="width:100%;border-collapse:collapse;margin-top:10px">
        <thead><tr><th style="text-align:left;border-bottom:2px solid #ccc;padding:5px">Data</th><th style="text-align:left;border-bottom:2px solid #ccc;padding:5px">Nº</th><th style="text-align:left;border-bottom:2px solid #ccc;padding:5px">Animal</th><th style="text-align:right;border-bottom:2px solid #ccc;padding:5px">Valor</th><th style="text-align:left;border-bottom:2px solid #ccc;padding:5px">Detalhe</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
    <div class="m-actions"><button class="btn sec" onclick="fecharModal()">Fechar</button><button class="btn" onclick="window.print()">Imprimir relatório</button></div>`);
  toast(`Importação concluída: ${eventos.length} evento(s), ${totalAnimais} animal(is).`);
}

const TIPOS_SUPL=["Sal mineral","Sal proteinado","Ração / concentrado","Silagem","Feno","Cana + ureia","Creep feeding","Outro"];
/* unidade animal (UA = 450 kg de peso vivo) */
const UA_CAT={"Bezerro":0.25,"Bezerra":0.25,"Novilha":0.6,"Garrote":0.7,"Vaca":1,"Touro":1.4,"Boi":1.1,
  "Potro":0.5,"Potra":0.5,"Cavalo":1.2,"Égua":1.2,"Garanhão":1.3,
  "Cria":0.2,"Recria":0.5,"Matriz":1,"Reprodutor":1.2,"Adulto":1,"Adulta":1};
function uaAnimal(a){
  if(+a.pesoKg>0)return +a.pesoKg/450;
  const v=UA_CAT[a.categoria]; if(v)return v;
  return a.especie==="Bovino"?1:0.8;
}
const areaDe=id=>AR.find(x=>x.id===id);
const animaisDaArea=id=>A.filter(a=>a.status==="Ativo"&&a.areaId===id);
const animaisSemArea=()=>A.filter(a=>a.status==="Ativo"&&(!a.areaId||!areaDe(a.areaId)));
const uaTotal=arr=>arr.reduce((s,a)=>s+uaAnimal(a),0);
const ehPastejo=ar=>["Pasto","Capineira / silagem"].includes(ar.tipo);
const lotacao=ar=>{const ha=+ar.ha||0;return ha>0?uaTotal(animaisDaArea(ar.id))/ha:0};
/* consumo mensal estimado de um suplemento na área (kg) */
function consumoMensalSupl(ar,sp){
  const n=animaisDaArea(ar.id).length;
  const kgDia=sp.unid==="g/cab/dia"?(+sp.qtdDia||0)/1000:(+sp.qtdDia||0);
  return n*kgDia*30;
}
function situacaoLotacao(ar){
  const l=lotacao(ar), cap=+ar.capacidade||0;
  if(!ehPastejo(ar)||!(+ar.ha>0))return null;
  if(!animaisDaArea(ar.id).length)return {txt:"Vazio / em descanso",cls:"morto"};
  if(!cap)return {txt:num(l)+" UA/ha",cls:""};
  const pct=l/cap*100;
  if(pct>110)return {txt:"Superlotado · "+Math.round(pct)+"% do suporte",cls:"manut"};
  if(pct<50)return {txt:"Ocioso · "+Math.round(pct)+"% do suporte",cls:"vendido"};
  return {txt:"Adequado · "+Math.round(pct)+"% do suporte",cls:""};
}

/* ---- alocação de animais ---- */
function formAlocar(areaId){
  const alvo=areaId||(AR[0]&&AR[0].id)||"";
  if(!AR.length){toast("Cadastre uma área primeiro.");return}
  const ativos=A.filter(a=>a.status==="Ativo").sort((x,y)=>(x.numero||"").localeCompare(y.numero||"",undefined,{numeric:true}));
  abrirModal(`${cab("Alocar animais")}
  <div class="field"><label>Mover os animais marcados para</label><select id="al-area">${AR.map(x=>`<option value="${x.id}" ${x.id===alvo?"selected":""}>${esc(x.nome)} (${esc(x.tipo)})</option>`).join("")}</select></div>

  <div class="toolbar" style="margin-bottom:6px">
    <button class="btn sm sec" onclick="marcarTodosAlocar(true)">Marcar todos</button>

        <input type="checkbox" name="al-an" value="${a.id}">${esc(a.numero||nomeAnimal(a)||"s/nº")}
        <small style="color:var(--muted)">${ar?" · "+esc(ar.nome):" · sem área"}</small></label>`}).join("")}
  </div>
  <div class="criterio">Só os animais marcados são movidos. Para tirar um animal de qualquer área, use “Retirar da área”.</div>

}
function filtrarAlocar(){
  const q=val("al-busca").toLowerCase();
  document.querySelectorAll("#al-grid .fchk").forEach(l=>{l.style.display=l.dataset.label.includes(q)?"":"none"});
}
function marcarTodosAlocar(v){
  document.querySelectorAll("#al-grid .fchk").forEach(l=>{if(l.style.display!=="none")l.querySelector("input").checked=v});
}
function marcarDaArea(id){
  document.querySelectorAll("input[name=al-an]").forEach(c=>{const a=A.find(x=>x.id===c.value);c.checked=!!(a&&a.areaId===id)});
}
function idsAlocarMarcados(){return [...document.querySelectorAll("input[name=al-an]:checked")].map(x=>x.value)}
function salvarAlocacao(){
  const ids=idsAlocarMarcados(); if(!ids.length){toast("Marque ao menos um animal.");return}
  const areaId=val("al-area"), ar=areaDe(areaId);
  ids.forEach(id=>{const a=A.find(x=>x.id===id);if(a){a.areaId=areaId;a.areaDesde=hoje()}});
  salvarA(); fecharModal(); render(); toast(`${ids.length} animal(is) movido(s) para ${ar?ar.nome:"a área"}.`);
}
function retirarDaArea(){
  const ids=idsAlocarMarcados(); if(!ids.length){toast("Marque ao menos um animal.");return}
  ids.forEach(id=>{const a=A.find(x=>x.id===id);if(a){a.areaId="";a.areaDesde=""}});
  salvarA(); fecharModal(); render(); toast(`${ids.length} animal(is) sem área definida.`);
}

function formSupl(areaId,idx){
  const ar=areaDe(areaId); if(!ar)return;
  ar.supl=ar.supl||[];
  const sp=(idx!==undefined&&ar.supl[idx])||{tipo:"Sal mineral",unid:"g/cab/dia"};
  abrirModal(`${cab((idx!==undefined?"Editar":"Nova")+" suplementação — "+esc(ar.nome))}
  <div class="row2">
    <div class="field"><label>Produto</label><input id="sp-nome" value="${esc(sp.nome||"")}" placeholder="Ex.: Fosbovi 20, Proteinado 30%"></div>
    <div class="field"><label>Tipo</label><select id="sp-tipo">${opt(TIPOS_SUPL,sp.tipo||"Sal mineral")}</select></div>
  </div>
  <div class="row3">
    <div class="field"><label>Quantidade</label><input id="sp-qtd" type="number" step="0.01" min="0" value="${esc(sp.qtdDia||"")}"></div>
    <div class="field"><label>Unidade</label><select id="sp-unid">${opt(["g/cab/dia","kg/cab/dia"],sp.unid||"g/cab/dia")}</select></div>
    <div class="field"><label>Custo por kg (R$)</label><input id="sp-custo" type="number" step="0.01" min="0" value="${esc(sp.custoKg||"")}"></div>
  </div>
  <div class="field"><label>Observações</label><input id="sp-obs" value="${esc(sp.obs||"")}" placeholder="Período, cocho, frequência de reposição..."></div>
  <div class="criterio">Com a quantidade por cabeça e o número de animais da área, o sistema estima o consumo e o custo mensal.</div>
  <div class="m-actions">
    ${idx!==undefined?`<button class="btn warn" onclick="excluirSupl('${areaId}',${idx})">Excluir</button>`:""}
    <button class="btn" onclick="salvarSupl('${areaId}',${idx===undefined?"-1":idx})">Salvar</button>
  </div>`);
}
function salvarSupl(areaId,idx){
  const ar=areaDe(areaId); if(!ar)return;
  if(!val("sp-nome")&&!val("sp-tipo")){toast("Informe o produto.");return}
  const d={nome:val("sp-nome"),tipo:val("sp-tipo"),qtdDia:val("sp-qtd"),unid:val("sp-unid"),custoKg:val("sp-custo"),obs:val("sp-obs")};
  ar.supl=ar.supl||[];
  if(+idx>=0)ar.supl[+idx]=d; else ar.supl.push(d);
  salvarAR(); fecharModal(); render(); toast("Suplementação registrada.");
}
function excluirSupl(areaId,idx){
  const ar=areaDe(areaId); if(!ar||!ar.supl)return;
  if(!confirm("Excluir esta suplementação?"))return;
  ar.supl.splice(idx,1); salvarAR(); fecharModal(); render(); toast("Suplementação excluída.");
}

/* =============== DOCUMENTAÇÃO DA FAZENDA =============== */
const TIPOS_DOC=["CAR — Cadastro Ambiental Rural","CCIR / CIR","ITR","Outorga de água","Licença ambiental","Inscrição estadual / produtor","Contrato de arrendamento","Seguro","Financiamento / crédito rural","Certificado de vacinação","Alvará / laudo","Georreferenciamento","Outro"];
const RECORRENCIAS=["Única","Mensal","Trimestral","Semestral","Anual","Bienal"];
const MESES_REC={"Mensal":1,"Trimestral":3,"Semestral":6,"Anual":12,"Bienal":24};
const docDe=id=>DOC.find(d=>d.id===id);
function addMeses(iso,n){
  if(!iso)return "";
  const [a,m,d]=iso.split("-").map(Number);
  const base=new Date(a,m-1+n,1);
  const ultimo=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  const dia=Math.min(d,ultimo);
  return `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
}
const diasAte=iso=>{if(!iso)return null;return Math.round((new Date(iso+"T12:00")-new Date(hoje()+"T12:00"))/86400000)};
function statusDoc(d){
  const dias=diasAte(d.vencimento);
  if(d.status==="Arquivado")return {txt:"Arquivado",cls:"morto",ordem:5};
  if(dias===null)return {txt:"Sem vencimento",cls:"",ordem:4};
  if(dias<0)return {txt:`Vencido há ${-dias} dia(s)`,cls:"manut",ordem:0};
  if(dias<=30)return {txt:`Vence em ${dias} dia(s)`,cls:"manut",ordem:1};
  if(dias<=90)return {txt:`Vence em ${dias} dias`,cls:"vendido",ordem:2};
  return {txt:`Vigente até ${dBR(d.vencimento)}`,cls:"",ordem:3};
}
const docsCriticos=()=>DOC.filter(d=>d.status!=="Arquivado"&&d.vencimento&&diasAte(d.vencimento)<=60)
  .sort((a,b)=>(a.vencimento||"")<(b.vencimento||"")?-1:1);
const totalPagoDoc=d=>(d.pagamentos||[]).reduce((s,p)=>s+(+p.valor||0),0);
function vDocumentos(){
  const ativos=DOC.filter(d=>d.status!=="Arquivado");
  const vencidos=ativos.filter(d=>d.vencimento&&diasAte(d.vencimento)<0);
  const v30=ativos.filter(d=>d.vencimento&&diasAte(d.vencimento)>=0&&diasAte(d.vencimento)<=30);
  const v90=ativos.filter(d=>d.vencimento&&diasAte(d.vencimento)>30&&diasAte(d.vencimento)<=90);
  const custoAno=DOC.reduce((s,d)=>s+(d.pagamentos||[]).filter(p=>+String(p.data).slice(0,4)===anoInd).reduce((x,p)=>x+(+p.valor||0),0),0);
  let ls=DOC.slice();
  if(tipoDocF!=="Todos")ls=ls.filter(d=>d.tipo===tipoDocF);
  if(filtroDoc==="Vencidos")ls=ls.filter(d=>d.vencimento&&diasAte(d.vencimento)<0&&d.status!=="Arquivado");
  else if(filtroDoc==="A vencer (90 dias)")ls=ls.filter(d=>d.vencimento&&diasAte(d.vencimento)>=0&&diasAte(d.vencimento)<=90&&d.status!=="Arquivado");
  else if(filtroDoc==="Em dia")ls=ls.filter(d=>d.status!=="Arquivado"&&(!d.vencimento||diasAte(d.vencimento)>90));
  else if(filtroDoc==="Arquivados")ls=ls.filter(d=>d.status==="Arquivado");
  else ls=ls.filter(d=>d.status!=="Arquivado");
  ls.sort((a,b)=>statusDoc(a).ordem-statusDoc(b).ordem||((a.vencimento||"9")<(b.vencimento||"9")?-1:1));
  return `
  <h2>Documentação da fazenda</h2>
  <div class="kpis k4">
    <div class="kpi"><span>Documentos</span><b>${ativos.length}</b></div>
    <div class="kpi"><span>Vencidos</span><b class="${vencidos.length?"neg":""}">${vencidos.length}</b></div>
    <div class="kpi"><span>Vencem em 30 dias</span><b class="${v30.length?"neg":""}">${v30.length}</b></div>
    <div class="kpi"><span>Pago em ${anoInd}</span><b>${brl(custoAno)}</b></div>
  </div>
  ${(vencidos.length||v30.length)?`<div class="card" style="border-color:var(--clay);margin-bottom:12px">
    <h3 style="margin-top:0;color:var(--clay)">Exige providência</h3>
    <ul class="mini-list">
      ${[...vencidos,...v30].slice(0,8).map(d=>`<li><span>${esc(d.nome)} <small style="color:var(--muted)">· ${esc(d.tipo)}</small></span><span class="mono neg">${dBR(d.vencimento)}</span></li>`).join("")}
    </ul></div>`:""}
  <div class="toolbar">
    <select onchange="filtroDoc=this.value;render()">${opt(["Todos","Vencidos","A vencer (90 dias)","Em dia","Arquivados"],filtroDoc)}</select>
    <select onchange="tipoDocF=this.value;render()">${opt(["Todos",...TIPOS_DOC],tipoDocF)}</select>
    <button class="btn" onclick="formDoc()">+ Documento</button>
    <button class="btn sm sec" onclick="relatorioDocs()">📄 Relatório</button>
    <button class="btn sm sec" onclick="agendaDocs()">🔔 Gerar lembretes</button>
  </div>
  ${ls.length?ls.map(cardDoc).join(""):`<div class="empty">Nenhum documento neste filtro.<br>Cadastre CAR, CCIR, ITR, outorgas, licenças e contratos para acompanhar vencimentos e pagamentos.</div>`}`;
}

        <div style="font-size:12.5px;color:var(--muted);margin-top:2px">

        ${d.link?`<div style="font-size:12.5px;margin-top:3px"><a href="${esc(d.link)}" target="_blank" rel="noopener" style="color:var(--blue)">abrir arquivo ↗</a></div>`:""}
      </div>
      <div style="text-align:right">
        ${+d.valor?`<div><span class="big-num" style="font-size:18px">${brl(+d.valor)}</span><div style="font-size:11.5px;color:var(--muted)">valor da obrigação</div></div>`:""}

      <ul class="mini-list" style="margin-top:5px">${pg.slice().sort((a,b)=>(a.data||"")<(b.data||"")?1:-1).map((p,i)=>`<li><span>${dBR(p.data)}${p.obs?` <small style="color:var(--muted)">· ${esc(p.obs)}</small>`:""}</span><span class="mono">${brl(+p.valor||0)} <button class="btn ghost" onclick="excluirPagtoDoc('${d.id}','${p.id}')" aria-label="Excluir">✕</button></span></li>`).join("")}</ul>
    </details>`:""}
    <div class="toolbar" style="margin:9px 0 0">
      <button class="btn sm sec" onclick="formPagtoDoc('${d.id}')">+ Pagamento</button>
      ${d.recorrencia&&d.recorrencia!=="Única"?`<button class="btn sm sec" onclick="renovarDoc('${d.id}')">Renovar</button>`:""}
      <button class="btn ghost az" onclick="formDoc('${d.id}')">editar</button>
      <button class="btn ghost az" onclick="arquivarDoc('${d.id}')">${d.status==="Arquivado"?"reativar":"arquivar"}</button>
      <button class="btn ghost" onclick="excluirDoc('${d.id}')">excluir</button>
    </div>
  </div>`;

function salvarDoc(id){
  if(!val("dc-nome")){toast("Dê um nome ao documento.");return}
  const d={nome:val("dc-nome"),tipo:val("dc-tipo"),orgao:val("dc-orgao"),numero:val("dc-num"),

    valor:val("dc-valor"),responsavel:val("dc-resp"),link:val("dc-link"),obs:val("dc-obs")};
  if(id)Object.assign(docDe(id),d);
  else DOC.push({id:uid(),status:"Ativo",pagamentos:[],...d});
  salvarDOC(); fecharModal(); render(); toast("Documento salvo.");
}
function excluirDoc(id){
  if(!confirm("Excluir este documento e o histórico de pagamentos dele?"))return;
  DOC=DOC.filter(d=>d.id!==id); salvarDOC(); fecharModal(); render(); toast("Documento excluído.");
}
function arquivarDoc(id){
  const d=docDe(id); d.status=d.status==="Arquivado"?"Ativo":"Arquivado";
  salvarDOC(); render(); toast(d.status==="Arquivado"?"Documento arquivado.":"Documento reativado.");
}

function salvarPagtoDoc(id){
  const d=docDe(id); if(!d)return;
  const valor=+val("pd-valor")||0, data=val("pd-data")||hoje();
  if(!(valor>0)){toast("Informe o valor pago.");return}
  d.pagamentos=d.pagamentos||[];
  const pg={id:uid(),data,valor,obs:val("pd-obs")};
  if(marcado("pd-fin")){
    const l={id:uid(),data,cc:val("pd-cc"),categoria:"Administrativo e financeiro",tipo:"Saída",valor,
      descricao:`${d.nome}${d.numero?" — nº "+d.numero:""}`,status:"Pago",docId:d.id};
    F.push(l); pg.lancId=l.id; salvarF();
  }
  d.pagamentos.push(pg);
  if(marcado("pd-renova")&&d.vencimento&&MESES_REC[d.recorrencia]){
    d.emissao=d.vencimento;
    d.vencimento=addMeses(d.vencimento,MESES_REC[d.recorrencia]);
  }
  salvarDOC(); fecharModal(); render();
  toast(`Pagamento registrado${marcado("pd-fin")?" e lançado no financeiro":""}.`);
}
function excluirPagtoDoc(docId,pgId){
  const d=docDe(docId); if(!d)return;
  if(!confirm("Excluir este pagamento? O lançamento financeiro vinculado também é removido."))return;
  const pg=(d.pagamentos||[]).find(p=>p.id===pgId);
  if(pg&&pg.lancId){F=F.filter(l=>l.id!==pg.lancId);salvarF()}
  d.pagamentos=(d.pagamentos||[]).filter(p=>p.id!==pgId);
  salvarDOC(); fecharModal(); render(); toast("Pagamento excluído.");
}
function renovarDoc(id){
  const d=docDe(id); if(!d)return;
  const n=MESES_REC[d.recorrencia]; if(!n){toast("Documento sem renovação periódica.");return}
  if(!d.vencimento){toast("Informe o vencimento atual antes de renovar.");return}
  d.emissao=d.vencimento;
  d.vencimento=addMeses(d.vencimento,n);
  salvarDOC(); render(); toast(`Vencimento avançado para ${dBR(d.vencimento)}.`);
}
function agendaDocs(){
  const crit=docsCriticos();

  toast(n?`${n} lembrete(s) criado(s) na Agenda.`:"Os lembretes desses documentos já existem na Agenda.");
}

/* =============== INDICADORES ZOOTÉCNICOS E DE CUSTO =============== */
const paramsInd=()=>Object.assign({rendCarcaca:50,pesoArroba:15,rateio:{"Máquinas e Equipamentos":50,"Sede":30,"Fazenda":50},pctCria:60},CFG.indic||{});
const noAno=(iso,ano)=>iso&&+String(iso).slice(0,4)===ano;
/* despesas de um centro de custo no ano */
function despesaCC(cc,ano){return F.filter(l=>l.cc===cc&&l.tipo==="Saída"&&noAno(l.data,ano)).reduce((s,l)=>s+ +l.valor,0)}
function receitaCC(cc,ano){return F.filter(l=>l.cc===cc&&l.tipo==="Entrada"&&noAno(l.data,ano)).reduce((s,l)=>s+ +l.valor,0)}
/* custo de um setor produtivo = custo direto + rateio dos centros compartilhados */
function custoSetor(cc,ano){
  const P=paramsInd();
  const direto=despesaCC(cc,ano);
  let rateado=0;
  ccCompartilhados.forEach(sh=>{
    const pct=+(P.rateio||{})[sh]||0;
    if(!pct)return;
    const prod=ccProdutivos();
    /* o percentual definido do centro compartilhado é dividido entre os setores produtivos
       na proporção do custo direto de cada um */
    const base=prod.reduce((s,c)=>s+despesaCC(c,ano),0);
    if(base<=0)return;
    rateado+=despesaCC(sh,ano)*(pct/100)*(direto/base);
  });
  return {direto,rateado,total:direto+rateado};
}
/* produção de peso vivo no ano: soma dos ganhos entre pesagens consecutivas dentro do ano */
function ganhoPesoAno(ano){
  let kg=0, animaisPesados=0;
  A.forEach(a=>{
    const ps=historicoPesagens(a.id).filter(p=>noAno(p.data,ano));
    if(ps.length<2)return;
    const g=ps[ps.length-1].peso-ps[0].peso;
    if(g>0){kg+=g;animaisPesados++}
  });
  return {kg,animaisPesados};
}
const arrobasDe=(kgVivo,P)=>kgVivo*((+P.rendCarcaca||50)/100)/(+P.pesoArroba||15);
/* peso vivo vendido no ano (usa o último peso conhecido do animal) */
function vendasAno(ano){
  const vendidos=A.filter(a=>a.status==="Vendido"&&a.saida&&noAno(a.saida.data,ano));
  const kg=vendidos.reduce((s,a)=>s+(+a.pesoKg||0),0);
  const receita=F.filter(l=>l.categoria==="Venda de animais"&&l.tipo==="Entrada"&&noAno(l.data,ano)).reduce((s,l)=>s+ +l.valor,0);
  return {n:vendidos.length,kg,receita,comPeso:vendidos.filter(a=>+a.pesoKg>0).length};
}
const matrizesAtivas=()=>A.filter(a=>a.status==="Ativo"&&a.sexo==="F"&&["Vaca","Matriz"].includes(a.categoria));
const tourosAtivos=()=>A.filter(a=>a.status==="Ativo"&&a.sexo==="M"&&["Touro","Reprodutor"].includes(a.categoria));
const bezerrosAno=ano=>A.filter(a=>noAno(a.nascimento,ano));
function silagemAno(ano){
  const cults=CFG.culturas.filter(c=>c.tipo==="Silagem");
  const ton=AG.silos.filter(s=>cults.some(c=>c.id===s.culturaId)&&noAno(s.fechamento,ano)).reduce((x,s)=>x+(+s.qtd||0),0);
  const custo=cults.reduce((x,c)=>x+custoSetor(c.nome,ano).total,0);
  return {ton,custo,cults};
}
function indicadores(ano){
  const P=paramsInd();
  const pec=custoSetor("Pecuária",ano);
  const recPec=receitaCC("Pecuária",ano);
  const gp=ganhoPesoAno(ano);
  const arrProd=arrobasDe(gp.kg,P);
  const vd=vendasAno(ano);
  const arrVend=arrobasDe(vd.kg,P);
  const matriz=matrizesAtivas().length, touro=tourosAtivos().length, bez=bezerrosAno(ano).length;
  const rebanho=A.filter(a=>a.status==="Ativo").length;
  const sil=silagemAno(ano);
  const haPasto=AR.filter(ehPastejo).reduce((s,a)=>s+(+a.ha||0),0);
  const custoCria=pec.total*((+P.pctCria||60)/100);
  return {
    P,pec,recPec,gp,arrProd,vd,arrVend,matriz,touro,bez,rebanho,sil,haPasto,custoCria,
    custoArroba: arrProd>0?pec.total/arrProd:0,
    precoArroba: arrVend>0?vd.receita/arrVend:0,
    custoBezerro: bez>0?custoCria/bez:0,
    custoVacaAno: matriz>0?custoCria/matriz:0,
    custoTouroAno: touro>0?pec.total*0.05/touro:0,
    custoAnimalMes: rebanho>0?pec.total/rebanho/12:0,
    custoTonSilagem: sil.ton>0?sil.custo/sil.ton:0,
    arrobaPorHa: haPasto>0?arrProd/haPasto:0,
    margemPec: recPec-pec.total,
    desfrute: rebanho>0?vd.n/rebanho*100:0
  };
}

function blocoCustoCategoria(){
  const ls=F.filter(l=>l.tipo==="Saída"&&noAno(l.data,anoInd)&&l.cc==="Pecuária");
  const m=new Map();
  ls.forEach(l=>{const k=l.categoria||"Outros";m.set(k,(m.get(k)||0)+ +l.valor)});
  const dados=[...m.entries()].map(([label,valor])=>({label,valor})).sort((a,b)=>b.valor-a.valor).slice(0,10);
  if(!dados.length)return "";
  return `<div class="card">
    <div class="gtit">Onde foi o dinheiro da pecuária — ${anoInd}</div>
    ${graficoBarras(dados,v=>brl(v))}
  </div>`;
}

  abrirModal(`${cab("Relatório de indicadores — "+anoInd)}
  <div class="relatorio-print">
    <h3 style="margin-top:0">Indicadores zootécnicos e de custo — ${anoInd}</h3>
    <p><b>Custo total da pecuária:</b> ${brl(i.pec.total)} (direto ${brl(i.pec.direto)} + rateio ${brl(i.pec.rateado)})<br>

/* =============== AGENDA (anotações e lembretes) =============== */
let filtroNota="Pendentes", ccNota="Todos";
const PRIORIDADES=["Alta","Normal","Baixa"];
function vAgenda(){
  let ns=NT.slice();
  if(ccNota!=="Todos")ns=ns.filter(n=>(n.cc||"Geral")===ccNota);
  const pend=ns.filter(n=>!n.feito), feitas=ns.filter(n=>n.feito);
  const h=hoje(), lim=addDias(h,7);
  const grupos=[
    ["Fixados",pend.filter(n=>n.fixado)],
    ["Atrasados",pend.filter(n=>!n.fixado&&n.data&&n.data<h)],
    ["Hoje",pend.filter(n=>!n.fixado&&n.data===h)],
    ["Próximos 7 dias",pend.filter(n=>!n.fixado&&n.data&&n.data>h&&n.data<=lim)],
    ["Mais adiante",pend.filter(n=>!n.fixado&&n.data&&n.data>lim)],
    ["Sem data",pend.filter(n=>!n.fixado&&!n.data)]
  ];
  const mostrar=filtroNota==="Concluídos"?[]:grupos.filter(g=>g[1].length);
  return `
  <h2>Agenda do gestor</h2>
  <div class="toolbar">
    <select onchange="filtroNota=this.value;render()">${opt(["Pendentes","Concluídos","Todos"],filtroNota)}</select>
    <select onchange="ccNota=this.value;render()">${opt(["Todos","Geral",...ccList()],ccNota)}</select>
    <button class="btn" onclick="formNota()">+ Anotação</button>
  </div>
  <div class="criterio" style="margin-bottom:10px">Recados, lembretes e pendências do dia a dia. O que tiver data aparece também na tela de Início; o que for marcado como fixado fica sempre no topo.</div>
  ${mostrar.length?mostrar.map(([tit,arr])=>`
    <div class="mes-bloco">
      <div class="mes-nome"><span>${tit}</span><span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">${arr.length}</span></div>
      ${arr.sort((a,b)=>(a.data||"9")<(b.data||"9")?-1:1).map(linhaNota).join("")}
    </div>`).join("")
  :(filtroNota==="Concluídos"?"":`<div class="empty">Nenhuma anotação pendente.<br>Use a agenda para lembretes de compra, cobrança, visita técnica, vencimento de documento.</div>`)}
  ${(filtroNota!=="Pendentes"&&feitas.length)?`<div class="mes-bloco">
    <div class="mes-nome"><span>Concluídos</span><span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">${feitas.length}</span></div>
    ${feitas.sort((a,b)=>(a.data||"")<(b.data||"")?1:-1).slice(0,40).map(linhaNota).join("")}
  </div>`:""}`;
}
function linhaNota(n){
  const atrasada=!n.feito&&n.data&&n.data<hoje();
  return `<div class="ev ${n.feito?"done":""}">
    <input type="checkbox" ${n.feito?"checked":""} onchange="toggleNota('${n.id}')" aria-label="Concluir">
    ${n.prioridade&&n.prioridade!=="Normal"?`<span class="ev-tipo ${n.prioridade==="Alta"?"tw":"tm"}">${esc(n.prioridade)}</span>`:""}
    <div style="flex:1">
      <div class="t">${n.fixado?"📌 ":""}${esc(n.titulo)}</div>
      ${n.texto?`<div class="d">${esc(n.texto)}</div>`:""}
      <div class="d">${esc(n.cc||"Geral")}${n.data?` · ${dBR(n.data)}${atrasada?' · <b style="color:var(--clay)">atrasado</b>':""}`:" · sem data"}</div>
    </div>
    <button class="btn ghost az" onclick="formNota('${n.id}')" aria-label="Editar">✎</button>
    <button class="btn ghost" onclick="excluirNota('${n.id}')" aria-label="Excluir">✕</button>
  </div>`;
}
function formNota(id){
  const n=NT.find(x=>x.id===id)||{prioridade:"Normal",cc:"Geral"};
  abrirModal(`${cab(id?"Editar anotação":"Nova anotação")}
  <div class="field"><label>Título</label><input id="nt-tit" value="${esc(n.titulo||"")}" placeholder="Ex.: Renovar licença de outorga"></div>
  <div class="field"><label>Anotação</label><textarea id="nt-txt" rows="3" placeholder="Detalhes, contatos, valores...">${esc(n.texto||"")}</textarea></div>
  <div class="row3">
    <div class="field"><label>Lembrar em (opcional)</label><input id="nt-data" type="date" value="${n.data||""}"></div>
    <div class="field"><label>Prioridade</label><select id="nt-pri">${opt(PRIORIDADES,n.prioridade||"Normal")}</select></div>
    <div class="field"><label>Centro de custo</label><select id="nt-cc">${opt(["Geral",...ccList()],n.cc||"Geral")}</select></div>
  </div>
  <div class="check"><input type="checkbox" id="nt-fix" ${n.fixado?"checked":""}><label style="margin:0;text-transform:none;font-size:14px;color:var(--ink)">Fixar no topo da agenda</label></div>

    ${id?`<button class="btn warn" onclick="excluirNota('${id}')">Excluir</button>`:""}

  </div>`);
}
function salvarNota(id){
  if(!val("nt-tit")){toast("Dê um título à anotação.");return}
  const d={titulo:val("nt-tit"),texto:val("nt-txt"),data:val("nt-data"),prioridade:val("nt-pri"),cc:val("nt-cc"),fixado:marcado("nt-fix")};
  if(id)Object.assign(NT.find(x=>x.id===id),d);
  else NT.push({id:uid(),feito:false,criado:hoje(),...d});
  salvarNT(); fecharModal(); render(); toast("Anotação salva.");
}
function toggleNota(id){const n=NT.find(x=>x.id===id);n.feito=!n.feito;salvarNT();render()}
function excluirNota(id){
  if(!confirm("Excluir esta anotação?"))return;
  NT=NT.filter(x=>x.id!==id); salvarNT(); fecharModal(); render(); toast("Anotação excluída.");
}
function notasDoPeriodo(){
  const h=hoje(), lim=addDias(h,7);
  return NT.filter(n=>!n.feito&&(n.fixado||(n.data&&n.data<=lim)))
    .sort((a,b)=>{
      if(a.fixado!==b.fixado)return a.fixado?-1:1;
      return (a.data||"9")<(b.data||"9")?-1:1;
    });
}

function horasMesFunc(fid,ano,mes){
  return EQ.presencas.filter(p=>p.funcId===fid&&p.presente&&+p.data.slice(0,4)===ano&&+p.data.slice(5,7)-1===mes)
    .reduce((s,p)=>s+(+p.horas||0),0);
}
function semanaAtual(){
  const h=new Date(); const dow=h.getDay(); // 0=domingo
  const seg=new Date(h); seg.setDate(h.getDate()-((dow+6)%7));
  return Array.from({length:6},(_,i)=>{const d=new Date(seg);d.setDate(seg.getDate()+i);return d.toISOString().slice(0,10)});
}

function toggleRateioFunc(){
  const m=marcado("fu-multi");
  document.getElementById("fu-cc-single").style.display=m?"none":"";
  document.getElementById("fu-cc-multi").style.display=m?"":"none";
  previaFolha();
}
function lerRateioMulti(){
  return ccList().map(c=>({cc:c,pct:+val("fu-pct-"+c.replace(/[^a-zA-Z0-9]/g,'_'))||0})).filter(r=>r.pct>0);
}
function previaFolha(){
  const el=document.getElementById("fu-previa"); if(!el)return;
  const t=(+val("fu-sal")||0)+(+val("fu-grat")||0)+(+val("fu-esoc")||0);
  el.innerHTML=t>0?`Custo mensal deste funcionário: <b style="font-family:var(--mono)">${brl(t)}</b> — lançado na folha em “Mão de obra e encargos”.`:"";
  const tot=document.getElementById("fu-pct-total");
  if(tot&&document.getElementById("fu-multi")&&marcado("fu-multi")){
    const soma=lerRateioMulti().reduce((s,r)=>s+r.pct,0);
    tot.innerHTML=`Total distribuído: <b style="font-family:var(--mono);color:${soma===100?"var(--green-dark)":"var(--clay)"}">${soma}%</b>${soma!==100?" — precisa somar 100%":""}`;
  }else if(tot)tot.innerHTML="";
}
function salvarFunc(id){
  if(!val("fu-nome")){toast("Informe o nome.");return}
  let rateio;
  if(marcado("fu-multi")){
    rateio=lerRateioMulti();
    const soma=rateio.reduce((s,r)=>s+r.pct,0);
    if(!rateio.length||soma!==100){toast("A soma dos percentuais precisa ser 100%.");return}
  }else{
    rateio=[{cc:val("fu-cc"),pct:100}];
  }
  const d={nome:val("fu-nome"),funcao:val("fu-funcao"),status:val("fu-status"),atividadePadrao:val("fu-padrao"),obs:val("fu-obs"),
    admissao:val("fu-admissao"),telefone:val("fu-tel"),cpf:val("fu-cpf"),rg:val("fu-rg"),ctps:val("fu-ctps"),
    endereco:val("fu-end"),alergias:val("fu-alergias"),contatoEmergNome:val("fu-emerg-nome"),contatoEmergTel:val("fu-emerg-tel"),
    salario:+val("fu-sal")||0,gratificacao:+val("fu-grat")||0,eSocial:+val("fu-esoc")||0,rateio};
  if(id)Object.assign(EQ.funcionarios.find(x=>x.id===id),d);
  else EQ.funcionarios.push({id:uid(),...d});
  salvarEQ(); fecharModal(); render(); toast("Funcionário salvo.");
}
function excluirFunc(id){
  const nf=F.filter(l=>l.funcId===id&&l.folhaRef).length;
  if(!confirm(`Excluir este funcionário? Ele sai das escalas, o histórico de presença é removido${nf?` e ${nf} lançamento(s) de folha saem do financeiro`:""}.`))return;
  EQ.funcionarios=EQ.funcionarios.filter(x=>x.id!==id);
  EQ.presencas=EQ.presencas.filter(p=>p.funcId!==id);
  E.forEach(e=>{if(e.equipe)e.equipe=e.equipe.filter(f=>f!==id)});
  if(nf){F=F.filter(l=>!(l.funcId===id&&l.folhaRef));salvarF()}
  salvarEQ(); salvarE(); fecharModal(); render(); toast("Funcionário excluído.");
}

function rateioFunc(f){
  if(f.rateio&&f.rateio.length)return f.rateio;
  return [{cc:f.cc||"Pecuária",pct:100}];
}
const chaveFolha=(ano,mes)=>`${ano}-${String(mes+1).padStart(2,"0")}`;
const folhaLancada=(ano,mes)=>F.filter(l=>l.folhaRef===chaveFolha(ano,mes));
function vFolha(){
  const comSal=funcAtivos().filter(f=>custoFunc(f)>0);
  const ref=chaveFolha(folhaAno,folhaMes);
  const lanc=folhaLancada(folhaAno,folhaMes);
  const tSal=comSal.reduce((s,f)=>s+(+f.salario||0),0);
  const tGrat=comSal.reduce((s,f)=>s+(+f.gratificacao||0),0);
  const tEsoc=comSal.reduce((s,f)=>s+(+f.eSocial||0),0);
  const tot=tSal+tGrat+tEsoc;
  const porCC={};
  comSal.forEach(f=>rateioFunc(f).forEach(r=>{porCC[r.cc]=(porCC[r.cc]||0)+custoFunc(f)*r.pct/100}));
  return `

    ${comSal.length?`<div class="tbl-wrap" style="border:none"><table>
      <thead><tr><th>Funcionário</th><th>Centro de custo</th><th style="text-align:right">Salário</th><th style="text-align:right">Gratificação</th><th style="text-align:right">e-Social</th><th style="text-align:right">Total</th></tr></thead>
      <tbody>${comSal.map(f=>{const rat=rateioFunc(f);return `<tr>
        <td><b>${esc(f.nome)}</b><br><span style="color:var(--muted);font-size:12px">${esc(f.funcao||"")}</span></td>
        <td>${rat.length>1?rat.map(r=>`${esc(r.cc)} <span style="color:var(--muted)">${r.pct}%</span>`).join("<br>"):esc(rat[0].cc)}</td>
        <td class="v">${brl(+f.salario||0)}</td>
        <td class="v">${brl(+f.gratificacao||0)}</td>
        <td class="v">${brl(+f.eSocial||0)}</td>
        <td class="v neg"><b>${brl(custoFunc(f))}</b></td></tr>`}).join("")}
        <tr><td colspan="2"><b>Total da folha</b></td><td class="v">${brl(tSal)}</td><td class="v">${brl(tGrat)}</td><td class="v">${brl(tEsoc)}</td><td class="v neg"><b>${brl(tot)}</b></td></tr>
      </tbody></table></div>
      <div class="criterio">Distribuição por centro: ${Object.entries(porCC).map(([c,v])=>`${esc(c)} <b style="font-family:var(--mono)">${brl(v)}</b>`).join(" · ")}. Ao lançar, cada funcionário vira uma ou mais saídas em “Mão de obra e encargos” (conforme o rateio) no dia 30 (ou último dia do mês) — entrando direto no resultado de cada centro e na análise integrada.</div>`
    :`<div class="criterio">Nenhum funcionário ativo com remuneração cadastrada. Informe salário, gratificação e e-Social no cadastro de cada um para gerar a folha.</div>`}
  </div>`;
}
function lancarFolha(){
  const comSal=funcAtivos().filter(f=>custoFunc(f)>0);
  if(!comSal.length){toast("Cadastre a remuneração dos funcionários primeiro.");return}
  const ref=chaveFolha(folhaAno,folhaMes);
  const ultimo=new Date(folhaAno,folhaMes+1,0).getDate();
  const data=`${ref}-${String(Math.min(30,ultimo)).padStart(2,"0")}`;
  let n=0;
  comSal.forEach(f=>{
    const partes=[];
    if(+f.salario>0)partes.push(`salário ${brl(+f.salario)}`);
    if(+f.gratificacao>0)partes.push(`gratificação ${brl(+f.gratificacao)}`);
    if(+f.eSocial>0)partes.push(`e-Social ${brl(+f.eSocial)}`);
    const rat=rateioFunc(f);
    rat.forEach(r=>{
      const valor=custoFunc(f)*r.pct/100;
      if(valor<=0)return;
      F.push({id:uid(),data,cc:r.cc,categoria:"Mão de obra e encargos",tipo:"Saída",valor,
        descricao:`Folha ${MESES[folhaMes]}/${folhaAno} — ${f.nome}${rat.length>1?` (${r.pct}% · `+r.cc+")":""} (${partes.join(" + ")})`,
        status:"Pendente",folhaRef:ref,funcId:f.id}); n++;
    });
  });
  salvarF(); render();
  toast(`Folha de ${MESES[folhaMes]} lançada: ${comSal.length} funcionário(s), ${n} lançamento(s). Marque como pago no Financeiro conforme quitar.`);
}
function desfazerFolha(){
  const ref=chaveFolha(folhaAno,folhaMes);
  if(!confirm(`Remover os lançamentos da folha de ${MESES[folhaMes]}/${folhaAno} do financeiro?`))return;
  F=F.filter(l=>l.folhaRef!==ref);
  salvarF(); render(); toast("Lançamentos da folha removidos.");
}

/* ---- análise integrada: centros produtivos × custos compartilhados ---- */
function analiseIntegrada(){
  const ano=anoFin;
  const fa=F.filter(l=>+l.data.slice(0,4)===ano);
  if(!fa.length)return "";
  const soma=(cc,tipo)=>fa.filter(l=>l.cc===cc&&l.tipo===tipo).reduce((s,l)=>s+ +l.valor,0);
  const prods=ccProdutivos().map(c=>({c,rec:soma(c,"Entrada"),desp:soma(c,"Saída")}));
  prods.forEach(p=>p.direto=p.rec-p.desp);
  const compartilhado=ccCompartilhados.reduce((s,c)=>s+soma(c,"Saída")-soma(c,"Entrada"),0);
  const horas=prods.map(p=>MQ.uso.filter(u=>+u.data.slice(0,4)===ano&&u.cc===p.c).reduce((s,u)=>s+ +u.horas,0));
  const totH=horas.reduce((a,b)=>a+b,0);
  const totD=prods.reduce((s,p)=>s+p.desp,0);
  let pesos,criterio;
  if(totH>0){pesos=horas.map(h=>h/totH);criterio=`Rateio pelas horas de máquina de ${ano}: ${prods.map((p,i)=>`${esc(p.c)} ${num(horas[i])} h`).join(" × ")}.`}
  else if(totD>0){pesos=prods.map(p=>p.desp/totD);criterio="Rateio proporcional às despesas diretas (registre o uso das máquinas para ratear pelas horas)."}
  else{pesos=prods.map(()=>1/prods.length);criterio="Rateio igualitário (sem horas de máquina nem despesas diretas registradas)."}
  prods.forEach((p,i)=>{p.rateio=compartilhado*pesos[i];p.final=p.direto-p.rateio});
  return `<div class="card">
    <h3 style="margin-top:0">Análise integrada ${ano} — centros produtivos</h3>
    <div class="tbl-wrap" style="border:none"><table>
      <thead><tr><th></th><th style="text-align:right">Receita</th><th style="text-align:right">Despesa direta</th><th style="text-align:right">Resultado direto</th><th style="text-align:right">Custo compartilhado</th><th style="text-align:right">Resultado final</th></tr></thead>
      <tbody>${prods.map((p,i)=>`<tr>
        <td><b>${esc(p.c)}</b> <span style="color:var(--muted);font-size:11.5px">${Math.round(pesos[i]*100)}%</span></td>
        <td class="v pos">${brl(p.rec)}</td><td class="v neg">${brl(p.desp)}</td>
        <td class="v ${p.direto<0?"neg":"pos"}">${brl(p.direto)}</td>
        <td class="v neg">${brl(p.rateio)}</td>
        <td class="v ${p.final<0?"neg":"pos"}"><b>${brl(p.final)}</b></td></tr>`).join("")}
      </tbody></table></div>
    <div class="criterio">Custos compartilhados do ano (Máquinas e Equipamentos + Sede + Fazenda, líquidos de receitas): <b style="font-family:var(--mono)">${brl(compartilhado)}</b>. ${criterio}</div>
  </div>`;
}

function importarBackup(inp){

  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!confirm("Importar substitui os dados atuais pelos do arquivo. Continuar?"))return;
    A=d.animais||[];F=d.financeiro||[];E=d.eventos||[];S=d.estoque||[];R=d.chuvas||[];GT=d.gtas||[];NT=d.agenda||[];AR=d.areas||[];DOC=d.documentos||[];

    MQ=Object.assign({frota:[],uso:[],manut:[]},d.maquinas||{});

    preencherDatalists();render();toast("Backup importado.");
  }catch(e){toast("Arquivo inválido — use um backup exportado por este sistema.")}};
  r.readAsText(f); inp.value="";
}

const TEM_WS=typeof window.storage!=="undefined";
async function stGet(k){
  try{
    if(TEM_WS){const r=await window.storage.get(k);return r?JSON.parse(r.value):null}
    const v=localStorage.getItem(k);return v?JSON.parse(v):null;
  }catch(e){return null}
}
async function stSet(k,v){
  try{
    if(TEM_WS){const r=await window.storage.set(k,JSON.stringify(v));if(!r)throw 0;}
    else localStorage.setItem(k,JSON.stringify(v));
  }catch(e){if(!semStorage){semStorage=true;document.getElementById("aviso-storage").style.display="block";}}
}
function storageDisponivel(){
  if(TEM_WS)return true;
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}
}
