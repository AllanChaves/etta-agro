  const b=e.target.closest("button"); if(!b)return;
  setTimeout(()=>window.scrollTo(0,0),0);
},true);
const renderOriginal=render;
render=function(){
  if(!USR.perfil){telaLogin();return}
  if(!abasPerfil().includes(tab))tab=abasPerfil()[0];
  const v=document.getElementById("view");
  if(tab==="ia"){v.innerHTML=vIA();atualizarHeader()}
  else if(tab==="leite"){v.innerHTML=vLeite();atualizarHeader()}
  else if(tab==="ops"){v.innerHTML=vMeuDia();atualizarHeader()}
  else renderOriginal();
  montarNav();
};

/* ---------- init ---------- */
async function init(){
  if(!storageDisponivel()){semStorage=true;document.getElementById("aviso-storage").style.display="block";}
  else{
    A=await stGet(KEYS.A)||[]; F=await stGet(KEYS.F)||[]; E=await stGet(KEYS.E)||[]; S=await stGet(KEYS.S)||[];
    R=await stGet(KEYS.R)||[]; GT=await stGet(KEYS.T)||[]; NT=await stGet(KEYS.N)||[];
    AR=await stGet(KEYS.AR)||[]; DOC=await stGet(KEYS.D)||[];
    CFG=Object.assign({culturas:[],manejos:{},especies:[]},await stGet(KEYS.C)||{});
    AG=Object.assign({colheitas:[],diaristas:[],silos:[],movSilo:[]},await stGet(KEYS.G)||{});
    MQ=Object.assign({frota:[],uso:[],manut:[]},await stGet(KEYS.M)||{});
    EQ=Object.assign({funcionarios:[],presencas:[]},await stGet(KEYS.Q)||{});
    LT=Object.assign({med:[],lact:[],vendas:[]},await stGet(KEYS.L)||{});
    USR=Object.assign({perfil:null,nome:"",funcId:""},await stGet(KEYS.U)||{});
  }
  if(!semStorage&&((!A.length&&!E.length&&!F.length&&!CFG.demoRecusada)||(CFG.demo&&CFG.demoVer!==4)))aplicarDados(gerarDemo());
  migrar();
  if(!CFG.acesso)CFG.acesso={pin:""};
  if(!CFG.suplementos)CFG.suplementos=[];
  if(!CFG.checklists)CFG.checklists={};
  if(!CFG.iaAntec)CFG.iaAntec=3;
  E.forEach(e=>{if(!e.checklist)e.checklist=[];if(!e.msgs)e.msgs=[]});
  presData=hoje();
  document.getElementById("racas").innerHTML=RACAS_BOV.map(r=>`<option>${r}</option>`).join("");
  preencherDatalists();
  render();
}

/* backup inclui os dados novos */
exportarBackup=(function(orig){return function(){
  const d={animais:A,financeiro:F,eventos:E,estoque:S,chuvas:R,gtas:GT,agenda:NT,areas:AR,documentos:DOC,config:CFG,agro:AG,maquinas:MQ,equipe:EQ,leite:LT,versao:"etta-2"};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:"application/json"}));
  a.download=`etta_agro_backup_${hoje()}.json`; a.click(); toast("Backup exportado.");
}})(exportarBackup);
importarBackup=(function(orig){return function(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);LT=Object.assign({med:[],lact:[],vendas:[]},d.leite||{});salvarLT()}catch(e){}};
  r.readAsText(f); orig(inp);
}})(importarBackup);

/* =====================================================================
   CHECKLISTS DE PREPARAÇÃO E COMUNICAÇÃO COM O COLABORADOR
   ===================================================================== */
const CHECK_PADRAO={
  "Vacinação":["Conferir estoque da vacina e validade","Caixa térmica com gelo / cadeia de frio","Seringas, agulhas e pistola dosadora limpas","Curral, tronco e brete revisados","Equipe avisada do horário","Separar lote / apartar animais"],
  "Vermifugação":["Conferir estoque do vermífugo","Pistola dosadora calibrada","Pesar ou estimar peso do lote","Curral e tronco revisados","Equipe avisada do horário"],
  "Medicação":["Medicamento e dose conferidos com o veterinário","Material de aplicação separado","Animal identificado e contido","Registrar carência de leite/abate"],
  "Reprodução":["Conferir protocolo e datas (D0, D8, D9/D10)","Hormônios e implantes em estoque","Botijão de sêmen com nível de nitrogênio ok","Bainhas, luvas e aplicador separados","Curral e tronco revisados","Animais apartados em jejum hídrico se necessário"],
  "Pesagem":["Balança aferida e bateria carregada","Brete e tronco revisados","Planilha / app aberto para registrar","Equipe avisada do horário"],
  "Manejo":["Material separado","Equipe avisada","Local preparado"]
};
function checklistSugerido(cc,base){
  const custom=CFG.checklists&&CFG.checklists[base];
  if(custom&&custom.length)return custom.slice();
  return (CHECK_PADRAO[base]||["Material separado","Equipe avisada do horário","Local preparado"]).slice();
}
const progressoCheck=e=>{const c=e.checklist||[];return c.length?c.filter(x=>x.ok).length/c.length:1};
const checkTxt=e=>{const c=e.checklist||[];return c.length?`${c.filter(x=>x.ok).length}/${c.length}`:""};

/* adiciona checklist, antecedência e recado ao formulário de atividade */
const formEventoOrig=formEvento;
formEvento=function(id,pre){
  formEventoOrig(id,pre);
  const e=E.find(x=>x.id===id)||{checklist:[],antec:CFG.iaAntec};
  const acts=document.querySelector("#modal .m-actions");
  const box=document.createElement("div");
  const lista=(e.checklist&&e.checklist.length)?e.checklist.map(x=>x.t):[];
  box.innerHTML=`
  <h3>Checklist de preparação</h3>
  <div class="criterio" style="margin-bottom:6px">O que precisa estar pronto antes do dia. A IA cobra o responsável conforme a antecedência abaixo.</div>
  <div class="row2">
    <div class="field"><label>Cobrar com antecedência de</label><select id="e-antec">${[1,2,3,5,7,10,15].map(n=>`<option value="${n}" ${+((e.antec??CFG.iaAntec))===n?"selected":""}>${n} dia(s)</option>`).join("")}</select></div>
    <div class="field"><label>&nbsp;</label><button type="button" class="btn sm sec" onclick="sugerirChecklistForm()">✦ Sugerir checklist (IA)</button></div>
  </div>
  <textarea id="e-check" rows="4" placeholder="Um item por linha">${esc(lista.join("\n"))}</textarea>
  ${id?"":`<div class="check" style="margin-top:8px"><input type="checkbox" id="e-avisar" checked><label style="margin:0;text-transform:none;font-size:14px;color:var(--ink)">Avisar a equipe escalada (recado na atividade)</label></div>`}`;
  acts.parentNode.insertBefore(box,acts);
  if(!id&&!lista.length)sugerirChecklistForm(true);
  const ta=document.getElementById("e-check");
  ta.dataset.auto=id?"":ta.value;
  ta.addEventListener("input",()=>{ta.dataset.auto=""});
  const trocar=()=>{if(ta.dataset.auto&&ta.value===ta.dataset.auto){ta.value="";sugerirChecklistForm(true);ta.dataset.auto=ta.value}};
  document.getElementById("e-tipo").addEventListener("change",trocar);
  document.getElementById("e-cc")?.addEventListener("change",()=>setTimeout(trocar,0));
};
function sugerirChecklistForm(silencioso){
  const cc=val("e-cc"), base=baseDeLabel(cc,val("e-tipo"));
  const atual=val("e-check");
  const sug=checklistSugerido(cc,base);
  document.getElementById("e-check").value=(atual?atual+"\n":"")+sug.filter(s=>!atual.includes(s)).join("\n");
  if(!silencioso){toast(`Checklist sugerido para ${base}.`);document.getElementById("e-check").dataset.auto=""}
}
const salvarEventoOrig=salvarEvento;
salvarEvento=function(id){
  const linhas=(document.getElementById("e-check")?.value||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const antec=+val("e-antec")||CFG.iaAntec;
  const avisar=marcado("e-avisar");
  const antes=new Set(E.map(x=>x.id)), dataForm=val("e-data");
  salvarEventoOrig(id);
  if(document.getElementById("overlay").classList.contains("on"))return; // validação falhou
  const novos=E.filter(x=>!antes.has(x.id));
  const alvo=id?E.find(x=>x.id===id):(novos.find(x=>x.data===dataForm)||novos[0]);
  if(!alvo)return;
  const velho=alvo.checklist||[];
  alvo.checklist=linhas.map(t=>({t,ok:!!(velho.find(v=>v.t===t)||{}).ok}));
  alvo.antec=antec; alvo.msgs=alvo.msgs||[];
  if(avisar&&(alvo.equipe||[]).length){
    alvo.msgs.push({id:uid(),data:new Date().toISOString(),de:USR.nome||"Gestão",deFunc:USR.funcId||"",para:alvo.equipe.slice(),
      texto:textoConvite(alvo),lidaPor:[USR.funcId||"gestao"]});
  }
  salvarE(); render();
};
function textoConvite(e){
  const c=(e.checklist||[]).map(x=>"• "+x.t).join("\n");
  return `Atividade: ${e.titulo} — ${dBR(e.data)}${e.cat?" ("+e.cat+")":""}.${c?"\nAntes do dia, deixar pronto:\n"+c:""}${e.obs?"\nObs.: "+e.obs:""}`;
}

/* linha de atividade ganha checklist e recados */
const linhaEventoOrig=linhaEvento;
linhaEvento=function(e){
  let h=linhaEventoOrig(e);
  const nMsg=(e.msgs||[]).length, naoLidas=(e.msgs||[]).filter(m=>!msgLida(m)).length;
  const ck=(e.checklist||[]).length?`<span class="chip ${progressoCheck(e)===1?"ok":"pend"}">☑ ${checkTxt(e)}</span>`:"";
  const bts=`${ck?`<button class="btn ghost az" onclick="abrirChecklist('${e.id}')" title="Checklist">☑</button>`:""}
    <button class="btn ghost az" onclick="abrirConversa('${e.id}')" title="Recados com a equipe">💬${nMsg?`<small>${nMsg}</small>`:""}${naoLidas?`<i class="dot"></i>`:""}</button>`;
  h=h.replace(`<button class="btn ghost az" onclick="formEvento(`,bts+`<button class="btn ghost az" onclick="formEvento(`);
  if(ck)h=h.replace(`<div class="d">`,`<div class="d">${ck} `);
  if(!ehGestao())h=h.replace(/<button class="btn ghost" onclick="excluirEvento\([^)]*\)"[^>]*>✕<\/button>/,"");
  return h;
};

function abrirChecklist(id){
  const e=E.find(x=>x.id===id); if(!e)return;
  const dd=diasAte(e.data);
  abrirModal(`${cab("Checklist — "+esc(e.titulo))}
  <div class="criterio">${dBR(e.data)} · ${dd<0?`<b class="neg">atrasada ${-dd} dia(s)</b>`:dd===0?"<b>é hoje</b>":`faltam ${dd} dia(s)`} · Equipe: ${(e.equipe||[]).map(nomeFunc).join(", ")||"não escalada"}</div>
  <div style="margin:10px 0">${(e.checklist||[]).map((c,i)=>`<label class="ck-item ${c.ok?"ok":""}"><input type="checkbox" ${c.ok?"checked":""} onchange="marcarCheck('${id}',${i},this.checked)"> ${esc(c.t)}${c.por?` <small>· ${esc(c.por)}</small>`:""}</label>`).join("")||`<div class="criterio">Sem itens. Edite a atividade para incluir.</div>`}</div>
  <div class="m-actions">
    <button class="btn sec" onclick="abrirConversa('${id}')">💬 Recados</button>
    ${progressoCheck(e)===1&&!e.feito?`<button class="btn" onclick="concluirAtividade('${id}')">Concluir atividade</button>`:""}
  </div>`);
}
function marcarCheck(id,i,v){
  const e=E.find(x=>x.id===id); if(!e)return;
  e.checklist[i].ok=v; e.checklist[i].por=v?USR.nome:"";
  salvarE(); abrirChecklist(id); render();
  if(progressoCheck(e)===1){
    e.msgs.push({id:uid(),data:new Date().toISOString(),de:USR.nome,deFunc:USR.funcId,para:["gestao"],texto:"✅ Checklist concluído — tudo pronto para a atividade.",auto:true,lidaPor:[USR.funcId||"gestao"]});
    salvarE();
  }
}
function concluirAtividade(id){const e=E.find(x=>x.id===id);e.feito=true;salvarE();fecharModal();render();toast("Atividade concluída.")}

/* recados por atividade */
const meuId=()=>USR.perfil==="gestao"?"gestao":USR.funcId;
const msgLida=m=>(m.lidaPor||[]).includes(meuId());
function msgParaMim(m){
  if(USR.perfil==="gestao")return (m.para||[]).includes("gestao");
  return (m.para||[]).includes(USR.funcId);
}
function minhasMsgsNaoLidas(){
  const r=[];
  E.forEach(e=>(e.msgs||[]).forEach(m=>{if(!msgLida(m)&&msgParaMim(m)&&m.deFunc!==meuId())r.push({e,m})}));
  return r;
}
function abrirConversa(id){
  const e=E.find(x=>x.id===id); if(!e)return;
  e.msgs=e.msgs||[];
  e.msgs.forEach(m=>{if(!msgLida(m)){m.lidaPor=m.lidaPor||[];m.lidaPor.push(meuId())}});
  salvarE();
  const eq=(e.equipe||[]).map(fid=>EQ.funcionarios.find(f=>f.id===fid)).filter(Boolean);
  abrirModal(`${cab("Recados — "+esc(e.titulo))}
  <div class="criterio">${dBR(e.data)} · ${esc(e.cc||"Geral")} · Equipe: ${eq.map(f=>esc(f.nome)).join(", ")||"ninguém escalado"}</div>
  <div class="chat">${e.msgs.length?e.msgs.map(m=>`<div class="msg ${m.deFunc===meuId()||(!m.deFunc&&ehGestao())?"eu":""} ${m.auto?"auto":""}">
      <div class="msg-h"><b>${esc(m.de)}</b> · ${new Date(m.data).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div>
      <div>${esc(m.texto).replace(/\n/g,"<br>")}</div></div>`).join("")
    :`<div class="criterio">Nenhum recado ainda. Escreva abaixo: a equipe escalada vê no “Meu dia”.</div>`}</div>
  <div class="field"><label>Novo recado</label><textarea id="msg-txt" rows="2" placeholder="Ex.: chegar às 6h no curral; buscar gelo na sede"></textarea></div>
  <div class="m-actions" style="flex-wrap:wrap">
    ${ehGestao()?`<button class="btn sec sm" onclick="document.getElementById('msg-txt').value=textoConvite(E.find(x=>x.id==='${id}'))">✦ Texto da atividade</button>`:""}
    ${eq.filter(f=>f.telefone).map(f=>`<button class="btn sec sm" onclick="enviarWhats('${id}','${f.id}')">📲 WhatsApp ${esc(f.nome.split(" ")[0])}</button>`).join("")}
    ${!ehGestao()?`<button class="btn sec sm" onclick="enviarMsg('${id}','⚠ Problema: ')">⚠ Avisar problema</button>`:""}
    <button class="btn" onclick="enviarMsg('${id}')">Enviar</button>
  </div>`);
  render();
}
function enviarMsg(id,prefixo){
  const e=E.find(x=>x.id===id); let t=val("msg-txt");
  if(prefixo&&!t){document.getElementById("msg-txt").value=prefixo;document.getElementById("msg-txt").focus();return}
  if(!t){toast("Escreva o recado.");return}
  const para=ehGestao()?(e.equipe||[]).slice():["gestao"];
  e.msgs.push({id:uid(),data:new Date().toISOString(),de:USR.nome,deFunc:USR.perfil==="gestao"?"":USR.funcId,para,texto:t,lidaPor:[meuId()]});
  salvarE(); abrirConversa(id); toast(ehGestao()?`Recado enviado para ${para.length} colaborador(es).`:"Recado enviado para a gestão.");
}
function enviarWhats(id,fid){
  const e=E.find(x=>x.id===id), f=EQ.funcionarios.find(x=>x.id===fid);
  const t=val("msg-txt")||textoConvite(e);
  const tel=String(f.telefone||"").replace(/\D/g,"");
  window.open(`https://wa.me/${tel.length<=11?"55"+tel:tel}?text=${encodeURIComponent(`Olá ${f.nome.split(" ")[0]}! `+t)}`,"_blank");
  e.msgs.push({id:uid(),data:new Date().toISOString(),de:USR.nome,deFunc:"",para:[fid],texto:"(via WhatsApp) "+t,lidaPor:[meuId()]});
  salvarE();
}

/* =====================================================================
   MOTOR DE LEMBRETES (IA) — cruza atividades, protocolos, rebanho,
   leite, estoque, documentos, silos, áreas e rastreabilidade
   ===================================================================== */
function lembretesIA(){
  const L=[], h=hoje(), add=(prio,ico,titulo,texto,acao,rotulo,grupo)=>L.push({prio,ico,titulo,texto,acao,rotulo,grupo});
  const gest=ehGestao();
  const minhas=e=>gest||(e.equipe||[]).includes(USR.funcId);
  E.filter(e=>!e.feito&&minhas(e)).forEach(e=>{
    const dd=diasAte(e.data);
    if(dd<0&&dd>=-60)add("alta","⏰",`Atividade atrasada: ${e.titulo}`,`Era para ${dBR(e.data)} (${-dd} dia(s) atrás). Conclua ou reprograme.`,`formEvento('${e.id}')`,"Abrir","Atividades");
    const antec=+(e.antec??CFG.iaAntec);
    if(dd>=0&&dd<=antec&&(e.checklist||[]).length&&progressoCheck(e)<1)
      add(dd<=1?"alta":"media","☑",`Checklist pendente: ${e.titulo}`,`${dd===0?"É hoje":`Em ${dd} dia(s)`} · ${checkTxt(e)} itens prontos. Faltam: ${e.checklist.filter(c=>!c.ok).slice(0,3).map(c=>c.t).join("; ")}${e.checklist.filter(c=>!c.ok).length>3?"…":""}`,`abrirChecklist('${e.id}')`,"Ver checklist","Atividades");
    if(gest&&dd>=0&&dd<=7&&!(e.equipe||[]).length)add("media","👥",`Sem equipe escalada: ${e.titulo}`,`Atividade em ${dBR(e.data)} ainda não tem responsável.`,`formEvento('${e.id}')`,"Escalar","Atividades");
    if(dd>=0&&dd<=1&&!(e.checklist||[]).length)add("baixa","📅",`${dd===0?"Hoje":"Amanhã"}: ${e.titulo}`,`${esc(e.cc||"Geral")}${e.cat?" · "+e.cat:""}`,`abrirConversa('${e.id}')`,"Recados","Atividades");
    // protocolo IATF: lembra as etapas D0 → D8 → D9/D10
    if(e.base==="Reprodução"&&e.subtipoRepro==="IATF"&&dd>=0&&dd<=12)
      add("media","🧬",`Protocolo IATF em ${dBR(e.data)}`,`Etapas do protocolo: D0 (implante + BE) em ${dBR(addDias(e.data,-10))}, D8 (retirada + PGF/eCG) em ${dBR(addDias(e.data,-2))}, inseminação em ${dBR(e.data)}. Conferir sêmen e hormônios.`,`formEvento('${e.id}')`,"Abrir","Protocolos");
  });
  if(gest){
    // IATF realizada sem DG agendado
    E.filter(e=>e.feito&&e.base==="Reprodução"&&e.subtipoRepro==="IATF"&&diasAte(e.data)<=-25&&diasAte(e.data)>=-90).forEach(e=>{
      const temDG=E.some(x=>x.subtipoRepro==="DG"&&x.data>e.data&&(x.animais||[]).some(a=>(e.animais||[]).includes(a)));
      if(!temDG)add("alta","🧬","DG não agendado após IATF",`IATF de ${dBR(e.data)} (${(e.animais||[]).length} animais) sem diagnóstico de gestação programado.`,`formEvento('',{data:'${addDias(e.data,30)}',tipo:'Reprodução',animais:${JSON.stringify(e.animais||[]).replace(/"/g,"'")}})`,"Agendar DG","Protocolos");
    });
    // sanidade do ano
    const ano=new Date().getFullYear();
    if(A.some(a=>a.status==="Ativo"&&a.especie==="Bovino")&&!E.some(e=>e.origem==="template"&&+e.data.slice(0,4)===ano))
      add("media","💉",`Calendário sanitário ${ano} não gerado`,"O rebanho bovino ainda não tem o protocolo anual de vacinas e vermífugos no calendário.",`anoCal=${ano};gerarCalendario()`,"Gerar agora","Protocolos");
  }
  // rebanho
  const ativos=A.filter(a=>a.status==="Ativo");
  ativos.filter(a=>a.reproStatus==="Prenhe"&&a.prevParto).forEach(a=>{
    const dd=diasAte(a.prevParto);
    if(dd>=-3&&dd<=15)add(dd<=5?"alta":"media","🐄",`Parto previsto: ${nomeAnimal(a)}`,`${dBR(a.prevParto)} (${dd<0?`${-dd} dia(s) atrasado`:dd===0?"hoje":`em ${dd} dias`}). Levar para piquete maternidade e observar.`,`fichaAnimal('${a.id}')`,"Ficha","Rebanho");
  });
  if(gest){
    const semPeso=ativos.filter(a=>a.especie==="Bovino"&&(()=>{const p=historicoPesagens(a.id);return !p.length||diasAte(p[p.length-1].data)<-120})());
    if(semPeso.length>=3)add("baixa","⚖",`${semPeso.length} bovinos sem pesagem há +120 dias`,"Sem peso recente não dá para acompanhar GMD nem estimar arrobas.",`abrirSessao('Pesagem')`,"Abrir pesagem","Rebanho");
    const semBrinco=ativos.filter(a=>!a.numero);
    if(semBrinco.length)add("media","🏷",`${semBrinco.length} animal(is) sem número/brinco`,"Sem identificação não há rastreabilidade individual.",`irPara('animais')`,"Ver animais","Rastreabilidade");
    // rastreabilidade de saídas
    const semGTA=A.filter(a=>a.saida&&a.saida.tipo==="Venda"&&!a.saida.gtaId&&diasAte(a.saida.data)>=-365);
    if(semGTA.length)add("alta","🚚",`${semGTA.length} venda(s) sem GTA no último ano`,`Animais: ${semGTA.slice(0,5).map(nomeAnimal).join(", ")}${semGTA.length>5?"…":""}. Trânsito sem GTA é irregular — vincule a guia.`,`relatorioRastreabilidade()`,"Ver relatório","Rastreabilidade");
    GT.forEach(g=>{const s=gtaSaldo(g);if(s!==0)add("media","📄",`GTA ${g.numero||"s/nº"} com divergência`,`${s>0?`Faltam ${s} animal(is) vinculados`:`${-s} animal(is) a mais`} em relação ao documento.`,`irPara('animais')`,"Conferir","Rastreabilidade")});
  }
  // leite
  lactacoesAbertas().forEach(l=>{
    const a=A.find(x=>x.id===l.animalId); if(!a)return;
    const del=delLact(l);
    if(del>=300)add("alta","🥛",`Secar ${nomeAnimal(a)}`,`${del} dias em lactação. Secagem recomendada (~60 dias antes do próximo parto).`,`formSecagem('${l.id}')`,"Registrar secagem","Leite");
    else if(a.reproStatus==="Prenhe"&&a.prevParto&&diasAte(a.prevParto)<=65)add("alta","🥛",`Secar ${nomeAnimal(a)} — parto em ${diasAte(a.prevParto)} dias`,"Vaca prenhe precisa de ~60 dias de período seco.",`formSecagem('${l.id}')`,"Registrar secagem","Leite");
    const q=quedaProducao(a.id);
    if(q!==null&&q<=-20)add("media","📉",`Queda de leite: ${nomeAnimal(a)}`,`Produção ${Math.abs(q).toFixed(0)}% abaixo da média dos 7 dias anteriores. Avaliar mastite, cio ou alimentação.`,`fichaAnimal('${a.id}')`,"Ficha","Leite");
  });
  if(LT.lact.length&&!LT.med.some(m=>m.data===h)&&new Date().getHours()>=10)add("baixa","🥛","Produção de leite de hoje não lançada","Registre a ordenha da manhã/tarde para manter a média e o controle.",`formOrdenha()`,"Lançar","Leite");
  // estoque, documentos, silos, áreas
  S.filter(i=>+i.qtd<=0||+i.qtd<=+(i.min||2)).slice(0,6).forEach(i=>add(+i.qtd<=0?"alta":"media","📦",`Estoque baixo: ${i.nome}`,`Restam ${+i.qtd||0}. ${E.some(e=>!e.feito&&diasAte(e.data)>=0&&diasAte(e.data)<=15&&(e.produto||"").toLowerCase()===String(i.nome).toLowerCase())?"Há atividade nos próximos 15 dias que usa este item!":"Programe a reposição."}`,`irPara('estoque')`,"Estoque","Insumos"));
  if(gest){
    docsCriticos().forEach(d=>{const dd=diasAte(d.vencimento);add(dd<0?"alta":dd<=15?"media":"baixa","📑",`${d.nome} ${dd<0?"vencido":"vence em "+dd+" dias"}`,`${d.tipo} · ${dBR(d.vencimento)}`,`irPara('docs')`,"Documentos","Documentos")});
    AR.filter(a=>ehPastejo(a)&&+a.ha>0&&+a.capacidade>0&&lotacao(a)>+a.capacidade*1.1).forEach(a=>add("media","🌾",`Área superlotada: ${a.nome}`,`${num(lotacao(a))} UA/ha para capacidade de ${num(a.capacidade)}.`,`irPara('areas')`,"Áreas","Áreas"));
  }
  AG.silos.forEach(s=>{const dd=diasAte(s.abertura);if(dd!==null&&dd>=0&&dd<=10&&!s.aberto)add("baixa","🌽",`Abertura do ${s.nome||"silo"}`,`Prevista para ${dBR(s.abertura)}.`,`irPara(${gest?"'agro'":"'cal'"})`,"Ver","Agricultura")});
  const ord={alta:0,media:1,baixa:2};
  return L.sort((a,b)=>ord[a.prio]-ord[b.prio]);
}

   ===================================================================== */
const lactacoesAbertas=()=>LT.lact.filter(l=>!l.secagem&&A.some(a=>a.id===l.animalId&&a.status==="Ativo"));
const lactAtual=aid=>LT.lact.filter(l=>l.animalId===aid).sort((a,b)=>a.parto<b.parto?1:-1)[0];
const delLact=l=>Math.max(0,Math.round((new Date((l.secagem||hoje())+"T12:00")-new Date(l.parto+"T12:00"))/864e5));
function prodAnimalDia(aid,data){return LT.med.filter(m=>m.animalId===aid&&m.data===data).reduce((s,m)=>s+(+m.litros||0),0)}
function totalDia(data){
  const ind=LT.med.filter(m=>m.data===data&&m.animalId).reduce((s,m)=>s+(+m.litros||0),0);
  const tq=LT.med.filter(m=>m.data===data&&!m.animalId).reduce((s,m)=>s+(+m.litros||0),0);
  return Math.max(ind,tq)||ind+tq;
}
function quedaProducao(aid){
  const dias=[...new Set(LT.med.filter(m=>m.animalId===aid&&m.data<hoje()).map(m=>m.data))].sort().reverse();
  if(dias.length<4||diasAte(dias[0])<-3)return null;
  const ult=prodAnimalDia(aid,dias[0]);
  const ant=dias.slice(1,8).map(d=>prodAnimalDia(aid,d)), med=ant.reduce((s,x)=>s+x,0)/ant.length;
  return med>0?(ult-med)/med*100:null;
}
function mediaAnimal(aid,dias){
  const lim=addDias(hoje(),-dias);
  const ds=[...new Set(LT.med.filter(m=>m.animalId===aid&&m.data>=lim&&m.data<hoje()).map(m=>m.data))];
  return ds.length?ds.reduce((s,d)=>s+prodAnimalDia(aid,d),0)/ds.length:0;
}
const vacasAptas=()=>A.filter(a=>a.status==="Ativo"&&a.sexo==="F"&&!["Bezerra","Potra","Cria"].includes(a.categoria));
let leiteDias=30;
function vLeite(){
  const ab=lactacoesAbertas();
  const h=hoje(), lt=totalDia(h), ontem=totalDia(addDias(h,-1));

  const serie=dias.map(totalDia), comDados=serie.filter(x=>x>0);
  const media=comDados.length?comDados.reduce((s,x)=>s+x,0)/comDados.length:0;
  const mes=h.slice(0,7), litrosMes=dias.filter(d=>d.startsWith(mes)).reduce((s,d)=>s+totalDia(d),0);
  const delMed=ab.length?ab.reduce((s,l)=>s+delLact(l),0)/ab.length:0;
  const vendasMes=LT.vendas.filter(v=>v.data.startsWith(mes));
  const ranking=ab.map(l=>{const a=A.find(x=>x.id===l.animalId);return {l,a,m7:mediaAnimal(l.animalId,7),del:delLact(l),q:quedaProducao(l.animalId)}}).sort((x,y)=>y.m7-x.m7);
  return `<h2>Gado leiteiro</h2>
  <div class="kpis k4">
    <div class="kpi"><span>Hoje</span><b>${num(lt)} L</b></div>
    <div class="kpi"><span>Média ${leiteDias} dias</span><b>${num(media)} L/dia</b></div>
    <div class="kpi"><span>Em lactação</span><b>${ab.length} vaca(s)</b></div>
    <div class="kpi"><span>L/vaca/dia</span><b>${ab.length?num(media/ab.length):"—"}</b></div>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="formOrdenha()">🥛 Lançar ordenha</button>
    <button class="btn sec" onclick="formLactacao()">+ Iniciar lactação</button>
    ${ehGestao()?`<button class="btn sec" onclick="formVendaLeite()">$ Venda de leite</button>`:""}
    <button class="btn sm sec" onclick="abrirImportLeite()">📄 Importar planilha</button>
    <select onchange="leiteDias=+this.value;render()">${[15,30,60,90].map(n=>`<option value="${n}" ${n===leiteDias?"selected":""}>${n} dias</option>`).join("")}</select>
  </div>
  <div class="card"><h3 style="margin-top:0">Produção diária (L)</h3>
    ${comDados.length?graficoColunas(dias.map((d,i)=>i%Math.ceil(leiteDias/10)===0?d.slice(8,10)+"/"+d.slice(5,7):""),[{nome:"Litros",valores:serie,cor:PALETA[0]}],v=>num(v)):`<div class="criterio">Nenhuma ordenha lançada no período. Use “Lançar ordenha” por vaca ou o total do tanque.</div>`}
    <div class="criterio">Mês atual: <b>${num(litrosMes)} L</b>${ontem?` · Ontem: ${num(ontem)} L`:""}${ab.length?` · DEL médio: ${num(delMed)} dias`:""}</div>
  </div>
  <h3>Vacas em lactação</h3>
  ${ranking.length?`<div class="tbl-wrap"><table><tr><th>Vaca</th><th>Parto</th><th>DEL</th><th>Média 7d</th><th>Tendência</th><th></th></tr>
    ${ranking.map(r=>`<tr><td>${tagHTML(r.a)} ${esc(r.a.nome||r.a.raca||"")}</td><td class="v">${dBR(r.l.parto)}</td>
    <td class="v ${r.del>=300?"neg":""}">${r.del}</td><td class="v">${num(r.m7)} L</td>
    <td class="v ${r.q!==null&&r.q<=-20?"neg":r.q>0?"pos":""}">${r.q===null?"—":(r.q>0?"+":"")+r.q.toFixed(0)+"%"}</td>
    <td style="white-space:nowrap"><button class="btn ghost az" onclick="fichaAnimal('${r.a.id}')" title="Ficha">📄</button><button class="btn ghost az" onclick="formSecagem('${r.l.id}')" title="Secar">⏸</button></td></tr>`).join("")}
  </table></div>`:`<div class="empty">Nenhuma vaca em lactação.<br>Inicie a lactação de uma vaca recém-parida para controlar a produção individual.</div>`}
  ${ehGestao()&&LT.vendas.length?`<h3>Vendas de leite</h3><div class="tbl-wrap"><table><tr><th>Data</th><th>Comprador</th><th>Litros</th><th>R$/L</th><th>Total</th></tr>
    ${LT.vendas.slice().sort((a,b)=>a.data<b.data?1:-1).slice(0,12).map(v=>`<tr><td>${dBR(v.data)}</td><td>${esc(v.comprador||"")}</td><td class="v">${num(v.litros)}</td><td class="v">${brl(+v.preco||0)}</td><td class="v">${brl((+v.litros||0)*(+v.preco||0))}</td></tr>`).join("")}
  </table></div><div class="criterio">Mês: ${num(vendasMes.reduce((s,v)=>s+ +v.litros,0))} L vendidos · ${brl(vendasMes.reduce((s,v)=>s+v.litros*v.preco,0))}</div>`:""}
  ${LT.lact.some(l=>l.secagem)?`<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--blue)">Lactações encerradas (${LT.lact.filter(l=>l.secagem).length})</summary>
    ${LT.lact.filter(l=>l.secagem).map(l=>{const a=A.find(x=>x.id===l.animalId);const tot=LT.med.filter(m=>m.animalId===l.animalId&&m.data>=l.parto&&m.data<=l.secagem).reduce((s,m)=>s+ +m.litros,0);return `<div class="sem-dia">${a?esc(nomeAnimal(a)):"?"} — parto ${dBR(l.parto)}, secagem ${dBR(l.secagem)} · ${delLact(l)} dias · ${num(tot)} L registrados</div>`}).join("")}</details>`:""}`;
}
function formLactacao(aid){
  const aptas=vacasAptas().filter(a=>!lactacoesAbertas().some(l=>l.animalId===a.id));
  if(!aptas.length){toast("Nenhuma fêmea apta sem lactação aberta.");return}
  abrirModal(`${cab("Iniciar lactação")}
  <div class="field"><label>Vaca</label><select id="la-an">${aptas.map(a=>`<option value="${a.id}" ${a.id===aid?"selected":""}>${esc(nomeAnimal(a))} ${a.raca?"("+esc(a.raca)+")":""}</option>`).join("")}</select></div>
  <div class="field"><label>Data do parto</label><input id="la-parto" type="date" value="${hoje()}"></div>
  <div class="field"><label>Observações</label><input id="la-obs" placeholder="Ex.: 3ª cria, ordenha 2x"></div>
  <div class="m-actions"><button class="btn" onclick="salvarLactacao()">Salvar</button></div>`);
}
function salvarLactacao(){
  const aid=val("la-an"); if(!aid)return;
  LT.lact.push({id:uid(),animalId:aid,parto:val("la-parto")||hoje(),obs:val("la-obs")});
  const a=A.find(x=>x.id===aid); if(a&&a.reproStatus==="Prenhe"){a.reproStatus="Parida";a.prevParto="";salvarA()}
  salvarLT(); fecharModal(); render(); toast("Lactação iniciada.");
}

function salvarOrdenha(){
  const data=val("or-data")||hoje(), turno=val("or-turno"); let n=0;
  if(val("or-modo")==="tq"){const l=+val("or-litros");if(!l){toast("Informe os litros.");return}LT.med.push({id:uid(),data,turno,animalId:"",litros:l,por:USR.nome});n=1}
  else document.querySelectorAll("#or-ind input[data-an]").forEach(i=>{if(+i.value>0){LT.med.push({id:uid(),data,turno,animalId:i.dataset.an,litros:+i.value,por:USR.nome});n++}});
  if(!n){toast("Nenhum valor informado.");return}
  salvarLT(); fecharModal(); render(); toast(`Ordenha registrada (${n} lançamento(s)).`);
}

/* importação de planilha de leite com reconhecimento de colunas */
function abrirImportLeite(){
  abrirModal(`${cab("Importar planilha de leite")}
  <div class="criterio">Aceita .xlsx, .xls ou .csv. A IA procura colunas de data, vaca/brinco, turno e litros — não precisa estar em ordem nem com nome exato.</div>
  <input type="file" accept=".xlsx,.xls,.csv" onchange="lerPlanilhaLeite(this)" style="margin-top:10px">
  <div id="il-prev"></div>`);
}
let IL=null;
function lerPlanilhaLeite(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      let rows;
      if(/\.csv$/i.test(f.name)){const t=new TextDecoder().decode(ev.target.result);const sep=t.split("\n")[0].includes(";")?";":",";rows=t.split(/\r?\n/).filter(Boolean).map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,"").trim()))}
      else{if(typeof XLSX==="undefined"){toast("Leitor de Excel indisponível — salve como CSV.");return}const wb=XLSX.read(ev.target.result,{type:"array",cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""})}
      const hdr=rows[0].map(h=>String(h).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""));
      const achar=kws=>hdr.findIndex(h=>kws.some(k=>h.includes(k)));
      IL={rows:rows.slice(1).filter(r=>r.some(c=>String(c).trim())),col:{data:achar(["data","dia","date"]),vaca:achar(["vaca","brinco","animal","numero","n°","nº","id"]),turno:achar(["turno","ordenha","periodo"]),litros:achar(["litro","leite","prod","kg","volume","qtd"])},hdr:rows[0]};
      const c=IL.col, ok=k=>c[k]>=0?`<b class="pos">${esc(IL.hdr[c[k]])}</b>`:`<span class="neg">não encontrada</span>`;
      const prev=IL.rows.slice(0,5).map(r=>`<tr><td>${esc(r[c.data]??"")}</td><td>${esc(c.vaca>=0?r[c.vaca]:"tanque")}</td><td>${esc(c.turno>=0?r[c.turno]:"")}</td><td class="v">${esc(r[c.litros]??"")}</td></tr>`).join("");
      document.getElementById("il-prev").innerHTML=`<div class="card ia-card" style="margin-top:10px"><div class="ia-h"><span class="ia-spark">✦</span><div>Reconheci <b>${IL.rows.length}</b> linha(s) de controle leiteiro.<br>Data: ${ok("data")} · Vaca: ${ok("vaca")} · Turno: ${ok("turno")} · Litros: ${ok("litros")}</div></div></div>
        <div class="tbl-wrap"><table><tr><th>Data</th><th>Vaca</th><th>Turno</th><th>Litros</th></tr>${prev}</table></div>
        <div class="m-actions"><button class="btn" onclick="confirmarImportLeite()" ${c.data<0||c.litros<0?"disabled":""}>Importar</button></div>`;
    }catch(e){toast("Não consegui ler o arquivo.")}
  };
  r.readAsArrayBuffer(f);
}
function confirmarImportLeite(){
  const c=IL.col; let n=0, nr=new Set();
  IL.rows.forEach(r=>{
    const data=parseDataPlanilha(r[c.data]); const l=+String(r[c.litros]).replace(",",".");
    if(!data||!l)return;
    let aid="";
    if(c.vaca>=0&&String(r[c.vaca]).trim()){const a=A.find(x=>String(x.numero).trim()===String(r[c.vaca]).trim());if(a)aid=a.id;else{nr.add(r[c.vaca]);return}}
    LT.med.push({id:uid(),data,turno:c.turno>=0?r[c.turno]:"Dia (total)",animalId:aid,litros:l,por:"Importação"});n++;
  });
  salvarLT(); fecharModal(); render();
  toast(`${n} registro(s) importado(s).${nr.size?` ${nr.size} brinco(s) não reconhecido(s): ${[...nr].slice(0,4).join(", ")}`:""}`);
}

function linhaTempoAnimal(a){
  const T=[];
  T.push({d:a.nascimento||"",ico:"🐣",t:a.origem==="Compra"?"Entrada por compra":"Nascimento / cadastro",x:[a.raca,a.categoria,(()=>{const m=A.find(x=>x.id===a.maeId);return m?"mãe "+nomeAnimal(m):""})(),a.paiTxt?"pai "+a.paiTxt:""].filter(Boolean).join(" · ")});
  historicoAnimal(a.id).forEach(e=>T.push({d:e.data,ico:{"Pesagem":"⚖","Vacinação":"💉","Vermifugação":"🧪","Medicação":"💊","Reprodução":"🧬"}[baseEv(e)]||"🪢",t:e.tipo+(e.feito?"":" (pendente)"),x:linhaHistoricoAnimal(e,a.id).replace(/<[^>]+>/g,"")+(e.equipe&&e.equipe.length?" · por "+e.equipe.map(nomeFunc).join(", "):"")}));
  A.filter(f=>f.maeId===a.id).forEach(f=>T.push({d:f.nascimento,ico:"🍼",t:"Pariu",x:`cria ${nomeAnimal(f)||"s/nº"} (${f.sexo==="F"?"fêmea":"macho"})`}));
  LT.lact.filter(l=>l.animalId===a.id).forEach(l=>{T.push({d:l.parto,ico:"🥛",t:"Início de lactação",x:l.obs||""});if(l.secagem)T.push({d:l.secagem,ico:"⏸",t:"Secagem",x:`${delLact(l)} dias de lactação`})});
  if(a.saida){const g=a.saida.gtaId?gtaDe(a.saida.gtaId):null;
    T.push({d:a.saida.data,ico:a.saida.tipo==="Venda"?"🚚":"✝",t:a.saida.tipo==="Venda"?(g?"Saída com GTA":"Saída SEM GTA"):"Morte",alerta:a.saida.tipo==="Venda"&&!g,
      x:a.saida.tipo==="Venda"?[a.saida.comprador?"comprador "+a.saida.comprador:"",g?`GTA ${g.numero||"s/nº"} · ${g.finalidade||""} · destino ${g.destino||"?"} ${g.municipio||""}`:"nenhuma GTA vinculada"].filter(Boolean).join(" · "):(a.saida.causa||"")});}
  return T.sort((x,y)=>(x.d||"")<(y.d||"")?-1:1);
}
function fichaAnimal(id){

    ${a.sexo==="F"?`<li><span>Reprodução</span><span class="mono">${esc(a.reproStatus||"—")}${a.prevParto?" · parto "+dBR(a.prevParto):""}</span></li>`:""}
    ${l?`<li><span>Lactação</span><span class="mono">${l.secagem?"seca desde "+dBR(l.secagem):delLact(l)+" DEL · "+num(mediaAnimal(a.id,7))+" L/dia"}</span></li>`:""}
  </ul>
  <h3>Linha do tempo</h3>
  <div class="tl">${T.map(t=>`<div class="tl-i ${t.alerta?"alerta":""}"><span class="tl-ico">${t.ico}</span><div><b>${esc(t.t)}</b> <span class="mono" style="font-size:12px;color:var(--muted)">${dBR(t.d)}</span><div class="lb-d">${esc(t.x)}</div></div></div>`).join("")}</div>
  </div>
  <div class="m-actions">
    ${a.sexo==="F"&&a.status==="Ativo"&&!lactacoesAbertas().some(x=>x.animalId===a.id)?`<button class="btn sec" onclick="formLactacao('${a.id}')">🥛 Iniciar lactação</button>`:""}
    <button class="btn sec" onclick="window.print()">🖨 Imprimir</button>
  </div>`);
}

  const vendas=A.filter(a=>a.saida&&a.saida.tipo==="Venda").sort((x,y)=>x.saida.data<y.saida.data?1:-1);
  const com=vendas.filter(a=>a.saida.gtaId), sem=vendas.filter(a=>!a.saida.gtaId);
  const mortes=A.filter(a=>a.saida&&a.saida.tipo==="Morte");
  abrirModal(`${cab("Rastreabilidade das saídas")}
  <div class="relatorio-print">
  <div class="kpis"><div class="kpi"><span>Saídas com GTA</span><b class="pos">${com.length}</b></div><div class="kpi"><span>Saídas sem GTA</span><b class="${sem.length?"neg":""}">${sem.length}</b></div><div class="kpi"><span>Mortes</span><b>${mortes.length}</b></div></div>
  ${sem.length?`<h3 class="neg">Saídas sem GTA</h3><div class="tbl-wrap"><table><tr><th>Animal</th><th>Data</th><th>Comprador</th><th></th></tr>${sem.map(a=>`<tr><td>${tagHTML(a)} ${esc(a.nome||a.raca||"")}</td><td>${dBR(a.saida.data)}</td><td>${esc(a.saida.comprador||"—")}</td><td><button class="btn ghost az" onclick="fichaAnimal('${a.id}')">📄</button></td></tr>`).join("")}</table></div>`:""}
  ${com.length?`<h3>Saídas com GTA</h3><div class="tbl-wrap"><table><tr><th>Animal</th><th>Data</th><th>GTA</th><th>Destino</th></tr>${com.map(a=>{const g=gtaDe(a.saida.gtaId)||{};return `<tr><td>${tagHTML(a)}</td><td>${dBR(a.saida.data)}</td><td>${esc(g.numero||"s/nº")} · ${esc(g.finalidade||"")}</td><td>${esc(g.destino||"")} ${esc(g.municipio||"")}</td></tr>`}).join("")}</table></div>`:""}
  ${!vendas.length?`<div class="empty">Nenhuma saída por venda registrada.</div>`:""}

function fonteReceita(l){
  if(/leite/i.test(l.descricao||l.desc||""))return "Leite";
  if(l.categoria==="Venda de animais")return "Venda de animais";

function pesoEstimado(a){
  if(+a.pesoKg)return +a.pesoKg;

function sparkPath(vals,w,h){
  const max=Math.max(...vals,1),min=Math.min(...vals,0),sp=(max-min)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1||1)*w,h-4-(v-min)/sp*(h-8)]);
  return pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
}

  if(!el){el=document.createElement("div");el.id="lancador";document.body.append(el)}
  const agora=new Date();
  const atalhos=USR.perfil==="gestao"
    ?[["+ Atividade","irAba('cal');formEvento()"],["🥛 Ordenha","fecharLancador();formOrdenha()"],["🌧 Chuva","fecharLancador();formChuva()"],["💬 Perguntar à IA","fecharLancador();formPergunta()"],["🎨 Tema","fecharLancador();escolherTema()"],["⚙ Personalizar","fecharLancador();formPersonalizar()"],["⬇ Backup","fecharLancador();exportarBackup()"],["⇄ Trocar perfil","fecharLancador();sairPerfil()"]]
    :[["🥛 Ordenha","fecharLancador();formOrdenha()"],["🌧 Chuva","fecharLancador();formChuva()"],["🐮 Nascimento","fecharLancador();formNascimento()"],["📝 Anotação","fecharLancador();formNota()"],["🎨 Tema","fecharLancador();escolherTema()"],["⇄ Trocar perfil","fecharLancador();sairPerfil()"]];
  el.innerHTML=`<div class="ln-top"><div><b>${esc(USR.nome.split(" ")[0])}</b><span>${esc(PERFIS[USR.perfil].nome)}</span></div>
      <div class="ln-hora">${agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</div>
      <button class="ln-x" onclick="fecharLancador()" aria-label="Fechar">✕</button></div>
    <div class="ln-row" id="ln-row">${abas.map((k,i)=>`<button class="ln-tile" data-i="${i}" style="--g1:${ABA_INFO[k].g[0]};--g2:${ABA_INFO[k].g[1]}" onclick="tocarTile(${i})"><i>${ABA_INFO[k].ico}</i>${(k==="ia"||k==="ops")&&badgeAba(k)?`<em>${badgeAba(k).replace(/<[^>]+>/g,"").trim()}</em>`:""}</button>`).join("")}</div>
    <div class="ln-info" id="ln-info"></div>
    <div class="ln-dots" id="ln-dots">${abas.map((_,i)=>`<i data-i="${i}"></i>`).join("")}</div>
    <div class="ln-atalhos"><small>Atalhos</small><div>${atalhos.map(([n,a])=>`<button onclick="${a}">${n}</button>`).join("")}</div></div>`;
  el.classList.add("on"); document.body.classList.add("ln-aberto");
  const row=document.getElementById("ln-row");
  row.onscroll=()=>{clearTimeout(row._t);row._t=setTimeout(()=>{
    const c=row.scrollLeft+row.clientWidth/2;let best=0,bd=1e9;
    row.querySelectorAll(".ln-tile").forEach((t,i)=>{const d=Math.abs(t.offsetLeft+t.offsetWidth/2-c);if(d<bd){bd=d;best=i}});
    if(best!==LANC_SEL){LANC_SEL=best;marcarTile(false)}},60)};
  requestAnimationFrame(()=>marcarTile(true,"instant"));
}
function marcarTile(rolar,comp){
  const abas=abasPerfil(), k=abas[LANC_SEL], row=document.getElementById("ln-row"); if(!row)return;
  row.querySelectorAll(".ln-tile").forEach((t,i)=>t.classList.toggle("sel",i===LANC_SEL));
  document.querySelectorAll("#ln-dots i").forEach((t,i)=>t.classList.toggle("on",i===LANC_SEL));
  document.getElementById("ln-info").innerHTML=`<h3>${nomeAba(k)}</h3><p>${ABA_INFO[k].d}</p><button class="ln-abrir" onclick="irAba('${k}')">${k===tab?"Voltar para esta tela":"Abrir"}</button>`;
  if(rolar){const t=row.children[LANC_SEL];row.scrollTo({left:t.offsetLeft-row.clientWidth/2+t.offsetWidth/2,behavior:comp||"smooth"})}
}
function tocarTile(i){if(i===LANC_SEL){irAba(abasPerfil()[i]);return}LANC_SEL=i;marcarTile(true)}
function fecharLancador(){document.getElementById("lancador")?.classList.remove("on");document.body.classList.remove("ln-aberto")}
document.addEventListener("keydown",e=>{
  const el=document.getElementById("lancador"); if(!el||!el.classList.contains("on"))return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){LANC_SEL=Math.min(abasPerfil().length-1,Math.max(0,LANC_SEL+(e.key==="ArrowRight"?1:-1)));marcarTile(true);e.preventDefault()}
  else if(e.key==="Enter"){irAba(abasPerfil()[LANC_SEL]);e.preventDefault()}
  else if(e.key==="Escape")fecharLancador();
});
const telaLoginMenu=telaLogin;
telaLogin=function(){document.getElementById("dock")?.remove();fecharLancador();telaLoginMenu()};

init();
</script>
<div class="dfloat"><a class="dhome" href="./">‹ Início da demonstração</a><div class="thm" role="group" aria-label="Tema"><button type="button" data-t="light">☀️ <span>Claro</span></button><button type="button" data-t="dark">🌙 <span>Escuro</span></button></div></div>
<script>(function(){var r=document.documentElement,bs=document.querySelectorAll(".thm button");function cur(){return r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}function sync(){var c=cur();bs.forEach(function(b){b.setAttribute("aria-pressed",b.dataset.t===c)})}bs.forEach(function(b){b.addEventListener("click",function(){r.setAttribute("data-theme",b.dataset.t);try{localStorage.setItem("etta-theme",b.dataset.t)}catch(e){}try{aplicarTema(b.dataset.t==="dark"?"noite":"safra",true);render()}catch(e){}sync()})});try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",sync)}catch(e){}sync()})();</script>
